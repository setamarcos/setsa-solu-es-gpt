<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bolão Brasil x Japão</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; text-align: center; }
    .container { background: #fff; padding: 20px; margin: 50px auto; width: 400px; border-radius: 8px; }
    h1 { color: green; }
    input, select { margin: 5px; padding: 8px; width: 90%; }
    button { background: green; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: darkgreen; }
    table { margin: 20px auto; border-collapse: collapse; width: 90%; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #eee; }
  </style>
</head>
<body>
  <div class="container">
    <h1>BOLÃO BRASIL x JAPÃO</h1>
    <form method="post" action="https://script.google.com/macros/s/AKfycbwdzLCkUNWM3uqQ3LCOmfVxNo6PRBi2TX06PRRx4LkLzqvvGwlTQCt9a4WE_d1Ll2BHpQ/exec">
      
      <input type="text" name="nome" placeholder="Nome"><br>
      <input type="text" name="contato" placeholder="WhatsApp"><br>
      
      <label>Placar Brasil:</label>
      <input type="number" name="placar_brasil" min="0"><br>
      
      <label>Placar Japão:</label>
      <input type="number" name="placar_japao" min="0"><br>
      
      <label>Tipo de Participação:</label><br>
      <input type="radio" name="tipo" value="Valor"> Valor R$5<br>
      <input type="radio" name="tipo" value="Especie"> Espécie<br>
      <input type="radio" name="tipo" value="Gratis"> Grátis<br><br>
      
      <label><input type="checkbox" name="comprovante" value="Sim"> Já enviei comprovante Pix</label><br><br>
      
      <button type="submit">Confirmar Palpite</button>
    </form>

    <!-- Resumo de Apostas -->
    <h2>Resumo de Apostas</h2>
    <p id="total">Carregando...</p>
    <table id="placares">
      <thead>
        <tr><th>Placar</th><th>Qtd Apostadores</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function carregarResumo() {
      try {
        const resp = await fetch("https://script.google.com/macros/s/AKfycbwdzLCkUNWM3uqQ3LCOmfVxNo6PRBi2TX06PRRx4LkLzqvvGwlTQCt9a4WE_d1Ll2BHpQ/exec");
        const dados = await resp.json();
        document.getElementById("total").innerText = "Total de apostas: " + dados.total;
        const tbody = document.querySelector("#placares tbody");
        tbody.innerHTML = "";
        dados.placares.forEach(p => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${p.placar}</td><td>${p.qtd}</td>`;
          tbody.appendChild(tr);
        });
      } catch(e) {
        document.getElementById("total").innerText = "Erro ao carregar resumo.";
      }
    }
    // Atualiza a cada 10 segundos
    carregarResumo();
    setInterval(carregarResumo, 10000);
  </script>
</body>
</html>
