<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Setasolucoes - Brasil x Escócia</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#009c3b 0%,#ffdf00 50%,#002776 100%);min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center}
        .container{background:white;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.2);max-width:500px;width:100%;padding:30px}
        h1{text-align:center;color:#002776;margin-bottom:10px;font-size:28px}
        .jogo{background:#f8f9fa;border:2px solid #009c3b;border-radius:8px;padding:15px;text-align:center;margin-bottom:20px;font-weight:bold;font-size:18px;color:#002776}
        .valor-pix{background:#fff3cd;border-left:4px solid #ffdf00;padding:15px;margin-bottom:20px;border-radius:4px}
        .valor-pix p{margin:5px 0;color:#333}
        .pix-chave{font-family:monospace;background:#e9ecef;padding:8px;border-radius:4px;display:block;margin-top:5px;word-break:break-all}
        .whats-info{background:#25D366;color:white;padding:10px;border-radius:6px;margin-top:10px;font-size:14px;text-align:center}
        label{display:block;margin-bottom:5px;color:#002776;font-weight:600;font-size:14px}
        input[type="text"],input[type="tel"],select{width:100%;padding:12px;border:2px solid #ddd;border-radius:6px;font-size:16px;margin-bottom:5px}
        input:focus,select:focus{outline:none;border-color:#009c3b}
        input.erro{border-color:#dc3545}
        .erro-msg{color:#dc3545;font-size:13px;margin-bottom:13px;display:none}
        .placar-box{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
        .placar-box input{width:70px;text-align:center;font-size:24px;font-weight:bold;margin-bottom:0}
        .placar-box span{font-size:24px;font-weight:bold;color:#002776}
        .time{font-size:14px;color:#555;text-align:center;margin-top:5px}
        .radio-group{display:flex;gap:20px;margin-bottom:18px}
        .radio-group label{display:flex;align-items:center;font-weight:400;margin:0}
        .radio-group input{width:auto;margin:0 8px 0 0}
        .checkbox-area{display:flex;align-items:center;margin-bottom:10px;background:#f8f9fa;padding:12px;border-radius:6px;border:2px solid transparent}
        .checkbox-area.erro{border-color:#dc3545;background:#f8d7da}
        .checkbox-area input{width:auto;margin:0 10px 0 0}
        .aviso-comprovante{font-size:13px;color:#dc3545;margin-bottom:15px;display:none;font-weight:600}
        button{width:100%;background:#009c3b;color:white;border:none;padding:15px;font-size:18px;font-weight:bold;border-radius:8px;cursor:pointer}
        button:disabled{background:#ccc;cursor:not-allowed}
        #msg{margin-top:15px;text-align:center;font-weight:bold;display:none}
        .success{color:#009c3b}
        .error{color:#dc3545}
    </style>
</head>
<body>
    <div class="container">
        <h1>BOLÃO SETASOLUCOES</h1>
        <div class="jogo">BRASIL x ESCÓCIA</div>

        <div class="valor-pix">
            <p><strong>Valor:</strong> R$ 5,00 via Pix ou Grátis</p>
            <p><strong>Chave Pix:</strong></p>
            <span class="pix-chave">setamarcos@yahoo.com.br</span>
            <div class="whats-info">Envie o comprovante no WhatsApp: (31) 98482-1901</div>
        </div>

        <form id="bolaoForm">
            <input type="hidden" name="jogo" value="Brasil x Escócia">
            
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">

            <label>Palpite:</label>
            <div class="placar-box">
                <div>
                    <input type="number" name="placar_brasil" min="0" max="20" required>
                    <div class="time">Brasil</div>
                </div>
                <span>X</span>
                <div>
                    <input type="number" name="placar_escocia" min="0" max="20" required>
                    <div class="time">Escócia</div>
                </div>
            </div>

            <label>Tipo de Participação:</label>
            <div class="radio-group">
                <label><input type="radio" name="tipo" value="Valor - R$ 5,00" required id="tipoPago"> Valor R$5</label>
                <label><input type="radio" name="tipo" value="Gratis" required id="tipoGratis"> Grátis</label>
            </div>

            <label for="contato">Contato/WhatsApp:</label>
            <input type="tel" id="contato" name="contato" required placeholder="(31) 98482-1901">
            <div class="erro-msg" id="erroTel">Formato inválido. Use: (31) 98482-1901 ou (31) 3231-1111</div>

            <div class="checkbox-area" id="boxComprovante">
                <input type="checkbox" id="comprovante_check" name="enviou_comprovante" value="Sim">
                <label for="comprovante_check" style="margin:0;">Já enviei o comprovante do Pix no WhatsApp</label>
            </div>
            <div class="aviso-comprovante" id="avisoComprovante">* Obrigatório para participação paga</div>

            <button type="submit" id="btnSubmit">Confirmar Palpite</button>
            <div id="msg"></div>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxUv6WKQn_srwDlWT8TMsPkNjOMnpEFKUK8h1Ah-x_ZbxRdSkZ5w9lwNuIqTP_7uhX_/exec';
        const whatsNumber = '5531984821901';
        const form = document.getElementById('bolaoForm');
        const btn = document.getElementById('btnSubmit');
        const msg = document.getElementById('msg');
        const tipoPago = document.getElementById('tipoPago');
        const tipoGratis = document.getElementById('tipoGratis');
        const checkComprovante = document.getElementById('comprovante_check');
        const boxComprovante = document.getElementById('boxComprovante');
        const avisoComprovante = document.getElementById('avisoComprovante');
        const inputTel = document.getElementById('contato');
        const erroTel = document.getElementById('erroTel');

        // MÁSCARA AJUSTADA: Aceita celular 11 dígitos e fixo 10 dígitos
        inputTel.addEventListener('input', (e) => {
            let valor = e.target.value.replace(/\D/g,'');
            if (valor.length > 11) valor = valor.slice(0,11);
            
            if (valor.length > 10) {
                valor = `(${valor.slice(0,2)}) ${valor.slice(2,7)}-${valor.slice(7)}`;
            } else if (valor.length > 6) {
                valor = `(${valor.slice(0,2)}) ${valor.slice(2,6)}-${valor.slice(6)}`;
            } else if (valor.length > 2) {
                valor = `(${valor.slice(0,2)}) ${valor.slice(2)}`;
            }
            e.target.value = valor;
        });

        // VALIDAÇÃO: Aceita (xx) xxxx-xxxx e (xx) xxxxx-xxxx
        function validaTelefone(tel) {
            const regex = /^\(\d{2}\)\s\d{4,5}-\d{4}$/;
            return regex.test(tel);
        }

        tipoPago.addEventListener('change', () => {
            if(tipoPago.checked) {
                avisoComprovante.style.display = 'block';
            }
        });

        tipoGratis.addEventListener('change', () => {
            if(tipoGratis.checked) {
                avisoComprovante.style.display = 'none';
                boxComprovante.classList.remove('erro');
            }
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // TRAVA 1: Telefone formato errado
            if(!validaTelefone(inputTel.value)) {
                inputTel.classList.add('erro');
                erroTel.style.display = 'block';
                return;
            }
            inputTel.classList.remove('erro');
            erroTel.style.display = 'none';
            
            // TRAVA 2: Se for pago e não marcou comprovante
            if(tipoPago.checked && !checkComprovante.checked) {
                boxComprovante.classList.add('erro');
                msg.style.display = 'block';
                msg.textContent = 'Marque que enviou o comprovante do Pix para participação paga.';
                msg.className = 'error';
                return;
            }
            
            boxComprovante.classList.remove('erro');
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            
            const formData = new FormData(form);
            
            // 1. Envia pra Planilha
            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    msg.style.display = 'block';
                    msg.textContent = 'Palpite registrado! Abrindo WhatsApp...';
                    msg.className = 'success';
                    
                    // 2. Monta texto e abre SEU WhatsApp
                    const nome = formData.get('nome');
                    const placarBR = formData.get('placar_brasil');
                    const placarES = formData.get('placar_escocia');
                    const tipo = formData.get('tipo');
                    const contato = formData.get('contato');
                    const comprovante = formData.get('enviou_comprovante') || 'Não';
                    
                    let textoWhats = `*BOLÃO SETASOLUCOES - NOVO PALPITE*%0A%0A`;
                    textoWhats += `*Nome:* ${nome}%0A`;
                    textoWhats += `*Jogo:* Brasil x Escócia%0A`;
                    textoWhats += `*Palpite:* ${placarBR} x ${placarES}%0A`;
                    textoWhats += `*Tipo:* ${tipo}%0A`;
                    textoWhats += `*Contato:* ${contato}%0A`;
                    textoWhats += `*Comprovante:* ${comprovante}`;
                    
                    setTimeout(() => {
                        window.open(`https://wa.me/${whatsNumber}?text=${textoWhats}`, '_blank');
                    }, 1000);
                    
                    form.reset();
                    avisoComprovante.style.display = 'none';
                    btn.disabled = false;
                    btn.textContent = 'Confirmar Palpite';
                })
                .catch(error => {
                    msg.style.display = 'block';
                    msg.textContent = 'Erro ao enviar. Tenta novamente.';
                    msg.className = 'error';
                    btn.disabled = false;
                    btn.textContent = 'Confirmar Palpite';
                });
        });
    </script>
</body>
</html>
