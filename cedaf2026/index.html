<style>
:root{ --seta-azul:#1a73e8; --seta-verde:#34a853; --seta-laranja:#ff8c00; --fundo:#fffaf0; }
body{font-family:'Segoe UI',Arial,sans-serif;max-width:950px;margin:0 auto;padding:16px;background:var(--fundo);color:#333}
h1{color:var(--seta-azul);text-align:center;font-size:26px}
.subtitulo{color:var(--seta-verde);text-align:center;font-weight:bold}
.btn-topo{background:var(--seta-azul);color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer;font-size:15px;margin:4px}
.btn-topo.ativo{background:var(--seta-verde)}
.btn-seta{background:var(--seta-verde);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:15px;margin:3px}
.btn-chute{background:var(--seta-laranja);color:#fff}
.btn-alt{width:100%;text-align:left;background:#fff;border:2px solid #ddd;padding:10px 12px;margin:4px 0;border-radius:6px;cursor:pointer;font-size:15px}
.btn-alt.selecionada{border-color:var(--seta-azul);background:#e8f0fe}
.btn-alt.travada{cursor:not-allowed;opacity:0.7}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,0.1);margin:16px 0}
.hint{font-size:14px;color:#5f6368;font-style:italic}
.textarea-redacao{width:100%;height:200px;padding:12px;font-size:15px;border:2px solid var(--seta-azul);border-radius:8px;margin:8px 0}
#resultadoFinal{display:none}
.prova-num{color:var(--seta-azul);font-weight:bold}
.questao-travada{opacity:0.6}
.btn-voz{background:#673ab7;color:#fff;font-weight:bold}
.btn-voz.escutando{background:#d32f2f;animation:pulseVoz 1.5s infinite}
.conselho-box{background:#f8f9fa;border-left:4px solid var(--seta-laranja);padding:10px;margin:8px 0;border-radius:4px;font-size:14px}
.export-bar{margin-top:16px;text-align:center}
@keyframes pulseVoz{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
@media print{body{background:#fff}.btn-topo,.btn-seta,.export-bar{display:none}}
</style>
</head>

Qual civilização inventou o papel?","ops":["Chinesa","Egípcia","Romana","Grega"],"gab":"a"},{"q":"Qual civilização usava hieróglifos?","ops":["Egípcia","Romana","Grega","Chinesa"],"gab":"a"},{"q":"Qual civilização criou os Jogos Olímpicos?","ops":["Grega","Romana","Egípcia","Chinesa"],"gab":"a"},{"q":"Qual civilização construiu aquedutos?","ops":["Romana","Grega","Egípcia","Chinesa"],"gab":"a"},{"q":"Qual civilização usava papiro para escrever?","ops":["Egípcia","Romana","Grega","Chinesa"],"gab":"a"},{"q":"Qual civilização criou o calendário solar?","ops":["Egípcia","Romana","Grega","Chinesa"],"gab":"a"},{"q":"Qual civilização construiu a Muralha da China?","ops":["Chinesa","Romana","Grega","Egípcia"],"gab":"a"},{"q":"Qual civilização criou o Senado?","ops":["Romana","Grega","Egípcia","Chinesa"],"gab":"a"},{"q":"Quem chegou ao Brasil em 1500?","ops":["Pedro Álvares Cabral","Cristóvão Colombo","Dom Pedro II","Vasco da Gama"],"gab":"a"},{"q":"Quem já vivia no Brasil antes de 1500?","ops":["Indígenas","Portugueses","Franceses","Espanhóis"],"gab":"a"},{"q":"Qual produto os portugueses buscavam no Brasil?","ops":["Pau-brasil","Café","Milho","Arroz"],"gab":"a"},{"q":"Qual era a principal atividade econômica no início da colonização?","ops":["Extração do pau-brasil","Mineração","Agricultura","Pecuária"],"gab":"a"},{"q":"Qual povo habitava cavernas na Pré-história?","ops":["Homem das cavernas","Romanos","Egípcios","Gregos"],"gab":"a"},{"q":"Qual invenção marcou o fim da Pré-história?","ops":["Escrita","Fogo","Roda","Arado"],"gab":"a"},{"q":"Qual metal foi usado na Idade dos Metais?","ops":["Bronze","Madeira","Pedra","Argila"],"gab":"a"},{"q":"Qual civilização construiu templos como o Partenon?","ops":["Grega","Romana","Egípcia","Chinesa"],"gab":"a"},{"q":"Qual civilização criou o alfabeto que usamos hoje?","ops":["Fenícia","Romana","Egípcia","Grega"],"gab":"a"},{"q":"Qual civilização criou o conceito de cidadania?","ops":["Grega","Romana","Egípcia","Chinesa"],"gab":"a"},{"q":"O que são linhas imaginárias que dividem a Terra na vertical?","ops":["Meridianos","Paralelos","Trópicos","Equador"],"gab":"a"},{"q":"Qual é a linha imaginária que divide a Terra ao meio?","ops":["Equador","Meridiano de Greenwich","Trópico de Câncer","Trópico de Capricórnio"],"gab":"a"},{"q":"Qual clima predomina na Amazônia?","ops":["Equatorial","Tropical","Semiárido","Temperado"],"gab":"a"},{"q":"Qual é a forma de relevo plana e elevada?","ops":["Chapada","Montanha","Vale","Planície"],"gab":"a"},{"q":"Qual é a maior cidade do Brasil em população?","ops":["São Paulo","Rio de Janeiro","Salvador","Brasília"],"gab":"a"},{"q":"Qual região do Brasil é mais seca?","ops":["Nordeste","Sudeste","Sul","Norte"],"gab":"a"},{"q":"Qual é o rio mais extenso do Brasil?","ops":["Amazonas","São Francisco","Paraná","Tocantins"],"gab":"a"},{"q":"Qual bioma tem árvores de pequeno porte e solo pobre?","ops":["Cerrado","Mata Atlântica","Amazônia","Pampa"],"gab":"a"},{"q":"Qual é a capital do Brasil?","ops":["Brasília","Rio de Janeiro","São Paulo","Salvador"],"gab":"a"},{"q":"O que é urbanização?","ops":["Crescimento das cidades","Crescimento do campo","Desmatamento","Industrialização"],"gab":"a"},{"q":"Qual é o estado mais ao sul do Brasil?","ops":["Rio Grande do Sul","Santa Catarina","Paraná","São Paulo"],"gab":"a"},{"q":"Qual é o oceano que banha o Brasil?","ops":["Atlântico","Pacífico","Índico","Ártico"],"gab":"a"},{"q":"Qual é o nome do mapa que mostra o mundo todo?","ops":["Planisfério","Croqui","Perfil","Carta"],"gab":"a"},{"q":"Qual é o instrumento que indica direção usando o norte magnético?","ops":["Bússola","GPS","Mapa","Globo"],"gab":"a"},{"q":"Qual região do Brasil tem mais florestas?","ops":["Norte","Sudeste","Sul","Centro-Oeste"],"gab":"a"},{"q":"Qual é o clima predominante no sertão nordestino?","ops":["Semiárido","Equatorial","Polar","Temperado"],"gab":"a"},{"q":"Qual é o clima predominante no sul do Brasil?","ops":["Temperado","Equatorial","Semiárido","Polar"],"gab":"a"},{"q":"Qual é o relevo predominante na Amazônia?","ops":["Planície","Montanha","Deserto","Planalto"],"gab":"a"},{"q":"Qual é o relevo predominante no Pantanal?","ops":["Planície","Montanha","Deserto","Planalto"],"gab":"a"},{"q":"Qual é o relevo predominante na Serra do Mar?","ops":["Montanha","Planície","Deserto","Planalto"],"gab":"a"},{"q":"Qual é a região mais populosa do Brasil?","ops":["Sudeste","Sul","Norte","Centro-Oeste"],"gab":"a"},{"q":"Qual é a região menos populosa do Brasil?","ops":["Centro-Oeste","Sudeste","Sul","Nordeste"],"gab":"a"},{"q":"Qual é a região mais urbanizada do Brasil?","ops":["Sudeste","Sul","Norte","Centro-Oeste"],"gab":"a"}];
const bancoProvas = [];for(let i=0;i<20;i++){const nomeTema = ['Internet','Meio ambiente','Bullying','Leitura','Esporte','Alimentação','Tecnologia','Sustentabilidade','Respeito','Tempo livre','Água','Cultura','Dinheiro','Ciência','Cidadania','Arte','Saúde','Amizade','Estudo','Futuro'][i];bancoProvas.push({id:i+1,tema:{nomeClean:nomeTema,titulo:`Tema ${i+1}: ${nomeTema}`,comando:"Redija um texto dissertativo-argumentativo sobre o tema.",textos:["Texto motivador 1","Texto motivador 2","Texto motivador 3"]},questoes:[...poolQuestoes].sort(()=>Math.random()-0.5).slice(0,10).map((q,idx)=>({q:`${idx+1}. ${q.q}`,ops:q.ops,gab:q.gab}))});}
let modoAtual='ambos';let provaAtual=null;let respostas=[];let recTitulo=null;let recDitado=null;let escutandoDitado=false;let temporizadorSilencio=null;let resultadoRedacaoHTML='';let notaRedacao=0;
function modo(m){modoAtual=m;document.querySelectorAll('.btn-topo').forEach(b=>b.classList.remove('ativo'));document.getElementById(`btn${m.charAt(0).toUpperCase()+m.slice(1)}`).classList.add('ativo');if(provaAtual)montarProva();}
function iniciar(){const feitas=JSON.parse(localStorage.getItem('provasFeitas')||'[]');const disponiveis=bancoProvas.filter(p=>!feitas.includes(p.id));if(disponiveis.length===0){alert('Parabéns! Você fez as 20 provas. Resetando...');localStorage.removeItem('provasFeitas');location.reload();return;}provaAtual=disponiveis[Math.floor(Math.random()*disponiveis.length)];document.getElementById('numProva').textContent=provaAtual.id;respostas=Array(10).fill(null);montarProva();}
function alternarVozTitulo(){const btn=document.getElementById('btnVozTitulo');const campo=document.getElementById('textoRedacao');const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){alert('Transcrição não suportada.');return;}if(recTitulo){recTitulo.stop();return;}recTitulo=new SpeechRecognition();recTitulo.lang='pt-BR';recTitulo.continuous=false;recTitulo.interimResults=false;btn.classList.add('escutando');btn.innerHTML='🛑 Escutando...';recTitulo.onresult=function(e){let trecho=e.results[0][0].transcript.trim();if(trecho.length>0){trecho=trecho.charAt(0).toUpperCase()+trecho.slice(1);campo.value=(campo.value.trim()==='')?trecho+"\n\n":trecho+"\n\n"+campo.value;}};recTitulo.onend=function(){btn.classList.remove('escutando');btn.innerHTML='🎙️ Falar Título';recTitulo=null;};recTitulo.start();}
function alternarDitado(){const btn=document.getElementById('btnDitado');const campo=document.getElementById('textoRedacao');const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){alert('Transcrição não suportada.');return;}if(recDitado&&escutandoDitado){fecharParagrafoPorSilencio();return;}recDitado=new SpeechRecognition();recDitado.lang='pt-BR';recDitado.continuous=true;recDitado.interimResults=false;escutandoDitado=true;btn.classList.add('escutando');btn.innerHTML='🛑 Escutando...';recDitado.onresult=function(e){clearTimeout(temporizadorSilencio);let trecho='';for(let i=e.resultIndex;i<e.results.length;++i){if(e.results[i].isFinal)trecho+=e.results[i][0].transcript;}if(trecho.trim().length>0){trecho=trecho.trim();let atual=campo.value;if(atual.trim()===''||atual.endsWith('\n\n')){trecho=trecho.charAt(0).toUpperCase()+trecho.slice(1);}else{trecho=' '+trecho;}campo.value+=trecho;temporizadorSilencio=setTimeout(fecharParagrafoPorSilencio,5000);}};recDitado.onend=function(){if(escutandoDitado){try{recDitado.start();}catch(err){}}else{btn.classList.remove('escutando');btn.innerHTML='🎙️ Falar Parágrafo';recDitado=null;}};recDitado.start();}
function fecharParagrafoPorSilencio(){const campo=document.getElementById('textoRedacao');let txt=campo.value.trim();if(txt.length>0&&!txt.endsWith('.')&&!txt.endsWith('\n\n')){campo.value=txt+".\n\n";}}
function montarProva(){let html='';if(modoAtual==='texto'||modoAtual==='ambos'){html+=`<h3>Redação: ${provaAtual.tema.titulo}</h3><p><strong>Comando:</strong> ${provaAtual.tema.comando}</p><div style="margin:12px 0"><button class="btn-seta btn-voz" id="btnVozTitulo" onclick="alternarVozTitulo()">🎙️ Falar Título</button><button class="btn-seta btn-voz" id="btnDitado" onclick="alternarDitado()">🎙️ Falar Parágrafo</button></div><p class="hint">Textos: ${provaAtual.tema.textos.join(' | ')}</p><textarea id="textoRedacao" class="textarea-redacao"></textarea><button class="btn-seta" onclick="corrigirRedacao()">📊 Corrigir Redação</button><div id="resultadoRedacao" style="display:none;margin-top:12px"></div><hr>`;}if(modoAtual==='prova'||modoAtual==='ambos'){html+=`<h3>10 Questões</h3>`;provaAtual.questoes.forEach((q,i)=>{html+=`<div class="questao" id="q${i}"><p><strong>${q.q}</strong></p>`;q.ops.forEach((op,idx)=>{const letra=['a','b','c','d'][idx];html+=`<button class="btn-alt" id="alt${i}${letra}" onclick="selecionar(${i},'${letra}')">${letra}) ${op}</button>`;});html+=`<div style="margin-top:8px;display:none" id="acoes${i}"><button class="btn-seta" onclick="confirmar(${i},'estudado')">Já estudei</button><button class="btn-seta btn-chute" onclick="confirmar(${i},'chute')">Chute</button></div></div><hr>`;});html+=`<button class="btn-seta" onclick="finalizar()" style="font-size:18px">📊 Finalizar Prova</button>`;}document.getElementById('areaProva').innerHTML=html;if(resultadoRedacaoHTML){document.getElementById('resultadoRedacao').innerHTML=resultadoRedacaoHTML;document.getElementById('resultadoRedacao').style.display='block';}}
function selecionar(idx,letra){if(respostas[idx]&&respostas[idx].confirmado)return;document.querySelectorAll(`#q${idx}.btn-alt`).forEach(b=>b.classList.remove('selecionada'));document.getElementById(`alt${idx}${letra}`).classList.add('selecionada');respostas[idx]={letra,tipo:null,confirmado:false};document.getElementById(`acoes${idx}`).style.display='block';}
function confirmar(idx,tipo){if(!respostas[idx]||!respostas[idx].letra)return alert('Marque uma alternativa!');respostas[idx].tipo=tipo;respostas[idx].confirmado=true;document.getElementById(`acoes${idx}`).style.display='none';document.querySelectorAll(`#q${idx}.btn-alt`).forEach(b=>b.classList.add('travada'));document.getElementById(`q${idx}`).classList.add('questao-travada');}
function corrigirRedacao(){const texto=document.getElementById('textoRedacao').value;if(texto.trim().length<10)return alert('Escreva a redação!');const palavras=texto.trim().split(/\s+/).length;const listaParagrafos=texto.split(/\n\n/).filter(p=>p.trim().length>2);const totalParagrafos=listaParagrafos.length;const conectivos=(texto.match(/mas|porém|então|portanto|assim|além disso|porque/gi)||[]).length;let palavraTema=provaAtual.tema.nomeClean.toLowerCase();let possuiPertinenciaTematica=texto.toLowerCase().includes(palavraTema);const c1=Math.min(200,palavras>100?180:palavras>50?140:100);const c2=possuiPertinenciaTematica?180:100;const c3=conectivos>4?170:conectivos>2?150:130;const c4=(totalParagrafos>=4&&totalParagrafos<=5)?170:130;const c5=160;notaRedacao=c1+c2+c3+c4+c5;resultadoRedacaoHTML=`<h4>Nota da Redação: ${notaRedacao}/1000</h4><p><strong>C1:</strong> ${c1} | <strong>C2:</strong> ${c2} | <strong>C3:</strong> ${c3}</p><p><strong>C4:</strong> ${c4} | <strong>C5:</strong> ${c5}</p><p class="hint">${palavras} palavras | ${totalParagrafos} parágrafos</p>`;document.getElementById('resultadoRedacao').innerHTML=resultadoRedacaoHTML;document.getElementById('resultadoRedacao').style.display='block';}
function finalizar(){if(modoAtual==='prova'||modoAtual==='ambos'){let acertosTotal=0,acertosEstudado=0,acertosChute=0,totalEstudado=0,totalChute=0,respondidas=0;respostas.forEach((r,i)=>{if(r&&r.confirmado){respondidas++;const qCorreta=provaAtual.questoes[i];const acertou=r.letra===qCorreta.gab;if(acertou){acertosTotal++;if(r.tipo==='estudado'){totalEstudado++;acertosEstudado++;}else{totalChute++;acertosChute++;}}else{if(r.tipo==='estudado')totalEstudado++;else totalChute++;}}});if(respondidas===0)return alert('Responda pelo menos uma questão!');const notaQ=Math.round((acertosTotal/10)*1000);const feitas=JSON.parse(localStorage.getItem('provasFeitas')||'[]');feitas.push(provaAtual.id);localStorage.setItem('provasFeitas',JSON.stringify(feitas));let htmlResultado=`<h3>Resultado Final - Prova ${provaAtual.id}</h3><h2>Nota Questões: ${notaQ}/1000</h2><p><strong>Respondidas:</strong> ${respondidas}/10</p><p><strong>Total de Acertos:</strong> ${acertosTotal}</p><p><strong>No que você já estudou:</strong> ${acertosEstudado}/${totalEstudado}</p><p><strong>No chute:</strong> ${acertosChute}/${totalChute}</p>`;if(resultadoRedacaoHTML){htmlResultado+=`<hr><h4>📝 Redação:</h4>${resultadoRedacaoHTML}`;}htmlResultado+=`<div class="export-bar"><button class="btn-seta" onclick="exportarPDF(${notaQ})">📄 PDF</button><button class="btn-seta" onclick="exportarXLSX(${notaQ})">📊 XLSX</button><button class="btn-seta" onclick="exportarWhats(${notaQ})">📱 WhatsApp</button><button class="btn-seta" style="background:#1a73e8" onclick="enviarParaCEDAF(${notaQ})">🚀 ENVIAR PARA CEDAF</button><button class="btn-seta" onclick="location.reload()">🎲 Nova Prova</button></div>`;document.getElementById('resultadoFinal').innerHTML=htmlResultado;document.getElementById('resultadoFinal').style.display='block';document.getElementById('areaProva').style.display='none';}else{alert('Redação corrigida acima!');}}
function enviarParaCEDAF(notaQ){const agora=new Date();const data=agora.toLocaleDateString('pt-BR');const hora=agora.toLocaleTimeString('pt-BR');const textoRedacao=document.getElementById('textoRedacao')?.value||'Não fez';let acertos=0;respostas.forEach(r=>{if(r&&r.confirmado&&r.letra===provaAtual.questoes[respostas.indexOf(r)].gab)acertos++;});const payload={data:data,hora:hora,prova:provaAtual.id,tema:provaAtual.tema.nomeClean,nome:userName,notaProva:notaQ,notaRedacao:notaRedacao,acertos:acertos,tipo:modoAtual,textoRedacao:textoRedacao.substring(0,500)};fetch(URL_CEDAF,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)}).then(()=>alert('✅ Enviado para o CEDAF!')).catch(err=>alert('❌ Erro: '+err));}
function exportarPDF(notaQ){const data=new Date().toISOString().split('T')[0];const titulo=`CEDAF2029_Prova${provaAtual.id}_${provaAtual.tema.nomeClean}`.replace(/\s/g,'');document.title=`${titulo}_${data}`;window.print();setTimeout(()=>{document.title='CEDAF 2029 - Laura'},1000);}
function exportarXLSX(notaQ){const data=new Date().toLocaleDateString('pt-BR');const titulo=`CEDAF2029_Prova${provaAtual.id}_${provaAtual.tema.nomeClean}`.replace(/\s/g,'');const wsResumo=XLSX.utils.aoa_to_sheet([['Data',data],['Prova',provaAtual.id],['Tema',provaAtual.tema.nomeClean],['Nota Prova',notaQ],['Nota Redação',notaRedacao]]);const dadosQuestoes=[['Questao','Sua Resposta','Gabarito','Status','Tipo']];respostas.forEach((r,i)=>{if(r&&r.confirmado){const q=provaAtual.questoes[i];const acertou=r.letra===q.gab?'Acerto':'Erro';dadosQuestoes.push([i+1,r.letra.toUpperCase(),q.gab.toUpperCase(),acertou,r.tipo]);}});const wsQuestoes=XLSX.utils.aoa_to_sheet(dadosQuestoes);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,wsResumo,'Resumo');XLSX.utils.book_append_sheet(wb,wsQuestoes,'Questoes');XLSX.writeFile(wb,`${titulo}_${new Date().toISOString().split('T')[0]}.xlsx`);}
function exportarWhats(notaQ){const textoRedacao=document.getElementById('textoRedacao')?.value||'';const primeiraLinha=textoRedacao.split('\n')[0].substring(0,40)||provaAtual.tema.nomeClean;let texto=`*CEDAF 2029 - Laura*\nProva ${provaAtual.id}: ${provaAtual.tema.nomeClean}\nNota Prova: ${notaQ}/1000\nRedação: ${primeiraLinha}\nNota Redação: ${notaRedacao}/1000\n`;respostas.forEach((r,i)=>{if(r&&r.confirmado){const q=provaAtual.questoes[i];const acertou=r.letra===q.gab?'✅':'❌';texto+=`Q${i+1}: ${r.letra.toUpperCase()} ${acertou}\n`;}});window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');}
iniciar();
</script>
