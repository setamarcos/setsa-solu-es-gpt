<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEDAF 2029 - Laura</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --seta-azul:#1a73e8;
  --seta-verde:#34a853;
  --seta-laranja:#ff8c00;
  --fundo:#fffaf0;
}
body{font-family:'Segoe UI',Arial,sans-serif;max-width:950px;margin:0 auto;padding:16px;background:var(--fundo);color:#333}
h1{color:var(--seta-azul);text-align:center;font-size:26px}
.subtitulo{color:var(--seta-verde);text-align:center;font-weight:bold}
.btn-topo{background:var(--seta-azul);color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer;font-size:15px;margin:4px}
.btn-topo.ativo{background:var(--seta-verde)}
.btn-seta{background:var(--seta-verde);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:15px;margin:3px}
.btn-chute{background:var(--seta-laranja);color:#fff}
.btn-alt{width:100%;text-align:left;background:#fff;border:2px solid #ddd;padding:10px 12px;margin:4px 0;border-radius:6px;cursor:pointer;font-size:15px}
.btn-alt.selecionada{border-color:var(--seta-azul);background:#e8f0fe}
.btn-alt.travada{cursor:not-allowed;opacity:0.7}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,0.1);margin:16px 0}
.hint{font-size:14px;color:#5f6368;font-style:italic}
.textarea-redacao{width:100%;height:200px;padding:12px;font-size:15px;border:2px solid var(--seta-azul);border-radius:8px;margin:8px 0}
#resultadoFinal{display:none}
.prova-num{color:var(--seta-azul);font-weight:bold}
.questao-travada{opacity:0.6}
.btn-voz{background:#673ab7;color:#fff;font-weight:bold}
.btn-voz.escutando{background:#d32f2f;animation:pulseVoz 1.5s infinite}
.conselho-box{background:#f8f9fa;border-left:4px solid var(--seta-laranja);padding:10px;margin:8px 0;border-radius:4px;font-size:14px}
.conselho-estudado{border-left-color:var(--seta-azul)}
.export-bar{margin-top:16px;text-align:center}
@keyframes pulseVoz{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
@media print{body{background:#fff}.btn-topo,.btn-seta,.export-bar{display:none}}
</style>
</head>
<body>
<h1>CEDAF 2029 🎯</h1>
<p class="subtitulo">Laura, 6º ano. Prova <span class="prova-num" id="numProva">1</span> de 20</p>

<div style="text-align:center;margin:16px 0">
  <button class="btn-topo" id="btnTexto" onclick="modo('texto')">📝 Só Redação</button>
  <button class="btn-topo" id="btnProva" onclick="modo('prova')">❓ Só Questões</button>
  <button class="btn-topo ativo" id="btnAmbos" onclick="modo('ambos')">📝+❓ Os Dois</button>
</div>

<div id="areaProva" class="card"></div>
<div id="resultadoFinal" class="card"></div>

<script>
const bancoProvas = [];
for(let i=0;i<20;i++){
  const nomeTema = ['Internet','Meio ambiente','Bullying','Leitura','Esporte','Alimentação','Tecnologia','Sustentabilidade','Respeito','Tempo livre','Água','Cultura','Dinheiro','Ciência','Cidadania','Arte','Saúde','Amizade','Estudo','Futuro'][i];
  bancoProvas.push({
    id:i+1,
    tema:{
      nomeClean: nomeTema,
      titulo:`Tema ${i+1}: ${nomeTema}`,
      comando:"Redija um texto dissertativo-argumentativo sobre o tema.",
      textos:["Texto motivador 1","Texto motivador 2","Texto motivador 3"]
    },
    questoes: gerarQuestoes()
  });
}

function gerarQuestoes(){
  const base = [
    ["Qual das palavras abaixo é um substantivo comum?", ["Brasil", "Maria", "Cachorro", "São Paulo"], "c"],
    ["Qual palavra tem o mesmo sentido de 'alegre'?", ["Triste", "Feliz", "Bravo", "Lento"], "b"],
    ["Se Ana tem 20 balas e ganha mais 15, com quantas balas ela fica?", ["5", "25", "30", "35"], "d"],
    ["Qual é o dobro de 12?", ["6", "14", "24", "36"], "c"],
    ["Como as plantas produzem o seu próprio alimento?", ["Pela respiração", "Pela digestão", "Pela fotossíntese", "Pelo vento"], "c"],
    ["Qual é o planeta em que vivemos?", ["Marte", "Júpiter", "Terra", "Vênus"], "c"],
    ["Quem já vivia no Brasil antes da chegada dos portugueses em 1500?", ["Os espanhóis", "Os indígenas", "Os franceses", "Os ingleses"], "b"],
    ["Qual instrumento usamos para medir a passagem das horas no dia a dia?", ["Termômetro", "Balança", "Relógio", "Régua"], "c"],
    ["Como chamamos a área onde há muitas fazendas, sítios e plantações?", ["Zona Urbana", "Zona Sul", "Zona Norte", "Zona Rural"], "d"],
    ["O que usamos para nos guiar e ver a representação de um país no papel?", ["Um mapa", "Um livro de receitas", "Um dicionário", "Um calendário"], "a"]
  ];
  return base.sort(()=>Math.random()-0.5).slice(0,10).map((q,idx)=>({
    q:`${idx+1}. ${q[0]}`,
    ops:q[1],
    gab:q[2]
  }));
}

let modoAtual = 'ambos';
let provaAtual = null;
let respostas = [];
let recTitulo = null;
let recDitado = null;
let escutandoDitado = false;
let temporizadorSilencio = null;
let resultadoRedacaoHTML = '';
let notaRedacao = 0;

function modo(m){
  modoAtual = m;
  document.querySelectorAll('.btn-topo').forEach(b=>b.classList.remove('ativo'));
  document.getElementById(`btn${m.charAt(0).toUpperCase()+m.slice(1)}`).classList.add('ativo');
  if(provaAtual) montarProva();
}

function iniciar(){
  const feitas = JSON.parse(localStorage.getItem('provasFeitas')||'[]');
  const disponiveis = bancoProvas.filter(p=>!feitas.includes(p.id));
  if(disponiveis.length===0){
    alert('Parabéns! Você fez as 20 provas. Resetando...');
    localStorage.removeItem('provasFeitas');
    location.reload();
    return;
  }
  provaAtual = disponiveis[Math.floor(Math.random()*disponiveis.length)];
  document.getElementById('numProva').textContent = provaAtual.id;
  respostas = Array(10).fill(null);
  montarProva();
}

function alternarVozTitulo(){
  const btn = document.getElementById('btnVozTitulo');
  const campo = document.getElementById('textoRedacao');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){alert('Transcrição de voz não suportada neste navegador.');return;}
  if(recTitulo){recTitulo.stop();return;}
  recTitulo = new SpeechRecognition();
  recTitulo.lang = 'pt-BR';recTitulo.continuous=false;recTitulo.interimResults=false;
  btn.classList.add('escutando');btn.innerHTML='🛑 Escutando Título...';
  recTitulo.onresult=function(e){
    let trecho=e.results[0][0].transcript.trim();
    if(trecho.length>0){
      trecho=trecho.charAt(0).toUpperCase()+trecho.slice(1);
      campo.value=(campo.value.trim()==='')?trecho+"\n\n":trecho+"\n\n"+campo.value;
    }
  };
  recTitulo.onend=function(){btn.classList.remove('escutando');btn.innerHTML='🎙️ Falar Botão Título';recTitulo=null;};
  recTitulo.start();
}

function alternarDitado(){
  const btn=document.getElementById('btnDitado');const campo=document.getElementById('textoRedacao');
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){alert('Transcrição de voz não suportada neste navegador.');return;}
  if(recDitado&&escutandoDitado){fecharParagrafoPorSilencio();return;}
  recDitado=new SpeechRecognition();recDitado.lang='pt-BR';recDitado.continuous=true;recDitado.interimResults=false;escutandoDitado=true;
  btn.classList.add('escutando');btn.innerHTML='🛑 Escutando Parágrafo...';
  recDitado.onresult=function(e){
    clearTimeout(temporizadorSilencio);let trecho='';
    for(let i=e.resultIndex;i<e.results.length;++i){if(e.results[i].isFinal)trecho+=e.results[i][0].transcript;}
    if(trecho.trim().length>0){
      trecho=trecho.trim();let atual=campo.value;
      if(atual.trim()===''||atual.endsWith('\n\n')){trecho=trecho.charAt(0).toUpperCase()+trecho.slice(1);}
      else{trecho=' '+trecho;}
      campo.value+=trecho;temporizadorSilencio=setTimeout(fecharParagrafoPorSilencio,5000);
    }
  };
  recDitado.onend=function(){
    if(escutandoDitado){try{recDitado.start();}catch(err){}}
    else{btn.classList.remove('escutando');btn.innerHTML='🎙️ Falar Botão Parágrafo';recDitado=null;}
  };
  recDitado.start();
}

function fecharParagrafoPorSilencio(){
  const campo=document.getElementById('textoRedacao');let txt=campo.value.trim();
  if(txt.length>0&&!txt.endsWith('.')&&!txt.endsWith('\n\n')){campo.value=txt+".\n\n";}
}

function montarProva(){
  let html='';
  if(modoAtual==='texto'||modoAtual==='ambos'){
    html+=`<h3>Redação: ${provaAtual.tema.titulo}</h3>
    <p><strong>Comando:</strong> ${provaAtual.tema.comando}</p>
    <div style="margin:12px 0">
      <button class="btn-seta btn-voz" id="btnVozTitulo" onclick="alternarVozTitulo()">🎙️ Falar Botão Título</button>
      <button class="btn-seta btn-voz" id="btnDitado" onclick="alternarDitado()">🎙️ Falar Botão Parágrafo</button>
    </div>
    <p class="hint">Textos motivadores: ${provaAtual.tema.textos.join(' | ')}</p>
    <textarea id="textoRedacao" class="textarea-redacao" placeholder="Escreva sua redação aqui..."></textarea>
    <button class="btn-seta" onclick="corrigirRedacao()">📊 Corrigir Redação</button>
    <div id="resultadoRedacao" style="display:none;margin-top:12px"></div><hr>`;
  }
  if(modoAtual==='prova'||modoAtual==='ambos'){
    html+=`<h3>10 Questões - Marque 1 alternativa e confirme</h3>`;
    provaAtual.questoes.forEach((q,i)=>{
      html+=`<div class="questao" id="q${i}"><p><strong>${q.q}</strong></p>`;
      q.ops.forEach((op,idx)=>{const letra=['a','b','c','d'][idx];html+=`<button class="btn-alt" id="alt${i}${letra}" onclick="selecionar(${i},'${letra}')">${letra}) ${op}</button>`;});
      html+=`<div style="margin-top:8px;display:none" id="acoes${i}">
        <button class="btn-seta" onclick="confirmar(${i},'estudado')">Já estudei</button>
        <button class="btn-seta btn-chute" onclick="confirmar(${i},'chute')">Não estudei - chute</button>
      </div></div><hr>`;
    });
    html+=`<button class="btn-seta" onclick="finalizar()" style="font-size:18px">📊 Finalizar Prova</button>`;
  }
  document.getElementById('areaProva').innerHTML=html;
  if(resultadoRedacaoHTML){document.getElementById('resultadoRedacao').innerHTML=resultadoRedacaoHTML;document.getElementById('resultadoRedacao').style.display='block';}
}

function selecionar(idx,letra){
  if(respostas[idx]&&respostas[idx].confirmado)return;
  document.querySelectorAll(`#q${idx}.btn-alt`).forEach(b=>b.classList.remove('selecionada'));
  document.getElementById(`alt${idx}${letra}`).classList.add('selecionada');
  respostas[idx]={letra,tipo:null,confirmado:false};
  document.getElementById(`acoes${idx}`).style.display='block';
}

function confirmar(idx,tipo){
  if(!respostas[idx]||!respostas[idx].letra)return alert('Marque uma alternativa primeiro!');
  respostas[idx].tipo=tipo;respostas[idx].confirmado=true;
  document.getElementById(`acoes${idx}`).style.display='none';
  document.querySelectorAll(`#q${idx}.btn-alt`).forEach(b=>b.classList.add('travada'));
  document.getElementById(`q${idx}`).classList.add('questao-travada');
}

function corrigirRedacao(){
  const texto=document.getElementById('textoRedacao').value;
  if(texto.trim().length<10)return alert('Escreva a sua redação antes de corrigir!');
  const linhasFicticiasPorPalavra=7;const palavras=texto.trim().split(/\s+/).length;
  const listaParagrafos=texto.split(/\n\n/).filter(p=>p.trim().length>2);
  const totalParagrafos=listaParagrafos.length;
  const conectivos=(texto.match(/mas|porém|então|portanto|assim|além disso|porque/gi)||[]).length;
  let primeiroBloco=listaParagrafos[0]||'';let palavraTema=provaAtual.tema.nomeClean.toLowerCase();
  let possuiPertinenciaTematica=primeiroBloco.toLowerCase().includes(palavraTema);
  let totalLinhasSimuladas=0;
  listaParagrafos.forEach(p=>{let pals=p.trim().split(/\s+/).length;totalLinhasSimuladas+=Math.max(1,Math.ceil(pals/linhasFicticiasPorPalavra));});
  const c1=Math.min(200,palavras>100?180:palavras>50?140:100);
  const c2=possuiPertinenciaTematica?180:100;
  const c3=conectivos>4?170:conectivos>2?150:130;
  const c4=(totalParagrafos>=4&&totalParagrafos<=5)?170:130;
  const c5=160;notaRedacao=c1+c2+c3+c4+c5;
  let analiseEstrutural='';
  if(totalParagrafos<4){analiseEstrutural+=`<li><strong>Déficit de Macroestrutura Block:</strong> Faltam ${4-totalParagrafos} parágrafo(s).</li>`;}
  else if(totalParagrafos>5){analiseEstrutural+=`<li><strong>Excesso Estrutural:</strong> O texto apresenta ${totalParagrafos} parágrafos.</li>`;}
  else{analiseEstrutural+=`<li><strong>Macroestrutura Nota 10:</strong> Excelente! ${totalParagrafos} parágrafos.</li>`;}
  let linhasAlvo=totalParagrafos*5;
  if(totalLinhasSimuladas<linhasAlvo){analiseEstrutural+=`<li><strong>Extensão:</strong> Faltam ${linhasAlvo-totalLinhasSimuladas} linhas.</li>`;}
  else{analiseEstrutural+=`<li><strong>Densidade de Conteúdo:</strong> Ótimo volume.</li>`;}
  if(!possuiPertinenciaTematica){analiseEstrutural+=`<li><strong>Alerta:</strong> Tema "${provaAtual.tema.nomeClean}" não explicitado.</li>`;}
  else{analiseEstrutural+=`<li><strong>Pertinência Temática:</strong> Validada.</li>`;}
  resultadoRedacaoHTML=`
    <h4>Nota da Redação: ${notaRedacao}/1000</h4>
    <p><strong>C1 Norma:</strong> ${c1} | <strong>C2 Tema:</strong> ${c2} | <strong>C3 Coesão:</strong> ${c3}</p>
    <p><strong>C4 Estrutura:</strong> ${c4} | <strong>C5 Proposta:</strong> ${c5}</p>
    <p class="hint">Métricas: ${palavras} palavras | ~${totalLinhasSimuladas} linhas | ${totalParagrafos} parágrafos</p>
    <hr style="border:1px dashed #ddd">
    <h5>📋 Parecer Técnico:</h5>
    <ul style="padding-left:20px;font-size:14px;line-height:20px;color:#444">${analiseEstrutural}</ul>`;
  document.getElementById('resultadoRedacao').innerHTML=resultadoRedacaoHTML;
  document.getElementById('resultadoRedacao').style.display='block';
}

function obterConselhoInovador(tipoErro){
  const tecnicasChute=["<strong>Alternativa Includente:</strong> A mais completa costuma ser a correta.",
    "<strong>Eliminação de Absurdos:</strong> Descarte 'nunca','sempre'.",
    "<strong>Raiz de Palavra:</strong> Quebre no radical.",
    "<strong>Contexto Direto:</strong> Releia o enunciado.",
    "<strong>Contraste de Opostos:</strong> Uma das duas opostas é a correta."];
  const tecnicasEstudo=["<strong>Revisão Ativa:</strong> Explique a diferença entre sua resposta e a correta.",
    "<strong>Pegadinha Sintática:</strong> Marque palavras-chave.",
    "<strong>Engenharia Reversa:</strong> Reconstrua a regra em voz alta.",
    "<strong>Velocidade vs Atenção:</strong> Gaste 15s relendo.",
    "<strong>Aplicação Prática:</strong> Crie 2 frases novas com a regra."];
  let randomIdx=Math.floor(Math.random()*5);
  return tipoErro==='chute'?`<strong>💡 Chute Técnico:</strong><br>${tecnicasChute[randomIdx]}`:`<strong>🧠 Revisão Ativa:</strong><br>${tecnicasEstudo[randomIdx]}`;
}

function finalizar(){
  if(modoAtual==='prova'||modoAtual==='ambos'){
    let acertosTotal=0,acertosEstudado=0,acertosChute=0,totalEstudado=0,totalChute=0,respondidas=0;let listaErrosHtml='';
    respostas.forEach((r,i)=>{
      if(r&&r.confirmado){
        respondidas++;const qCorreta=provaAtual.questoes[i];const acertou=r.letra===qCorreta.gab;
        if(acertou){acertosTotal++;if(r.tipo==='estudado'){totalEstudado++;acertosEstudado++;}else{totalChute++;acertosChute++;}}
        else{if(r.tipo==='estudado')totalEstudado++;else totalChute++;
          let classeVozBox=r.tipo==='estudado'?'conselho-estudado':'';
          let txtConselho=obterConselhoInovador(r.tipo);
          let indGabarito=['a','b','c','d'].indexOf(qCorreta.gab);let textoAlternativaCerta=qCorreta.ops[indGabarito];
          listaErrosHtml+=`<div class="conselho-box ${classeVozBox}">
            <strong>Questão Errada:</strong> ${qCorreta.q}<br>
            <span style="color:#d32f2f">Sua: ${r.letra.toUpperCase()}</span> |
            <span style="color:#34a853">Gabarito: ${qCorreta.gab.toUpperCase()}) ${textoAlternativaCerta}</span><br>
            <p style="margin:6px 0 0 0;color:#555">${txtConselho}</p></div>`;
        }
      }
    });
    if(respondidas===0)return alert('Responda e confirme pelo menos uma questão!');
    const notaQ=Math.round((acertosTotal/10)*1000);
    const feitas=JSON.parse(localStorage.getItem('provasFeitas')||'[]');feitas.push(provaAtual.id);
    localStorage.setItem('provasFeitas',JSON.stringify(feitas));
    let htmlResultado=`<h3>Resultado Final - Prova ${provaAtual.id}</h3>
      <h2>Nota Questões: ${notaQ}/1000</h2>
      <p><strong>Respondidas:</strong> ${respondidas}/10</p>
      <p><strong>Total de Acertos:</strong> ${acertosTotal} de ${respondidas}</p>
      <p><strong>No que você já estudou:</strong> ${acertosEstudado}/${totalEstudado}</p>
      <p><strong>No chute:</strong> ${acertosChute}/${totalChute}</p>`;
    if(listaErrosHtml!==''){htmlResultado+=`<hr style="border:1px dashed #ddd"><h4>📋 Mentoria:</h4>${listaErrosHtml}`;}
    else{htmlResultado+=`<p style="color:var(--seta-verde);font-weight:bold">🎯 Desempenho excelente!</p>`;}
    if(resultadoRedacaoHTML){htmlResultado+=`<hr style="border:1px dashed #ddd"><h4>📝 Correção da Redação:</h4>${resultadoRedacaoHTML}`;}
    htmlResultado+=`<div class="export-bar">
      <button class="btn-seta" onclick="exportarPDF(${notaQ})">📄 Exportar PDF</button>
      <button class="btn-seta" onclick="exportarXLSX(${notaQ})">📊 Exportar XLSX</button>
      <button class="btn-seta" onclick="exportarWhats(${notaQ})">📱 WhatsApp</button>
      <button class="btn-seta" onclick="location.reload()">🎲 Nova Prova</button>
    </div>`;
    document.getElementById('resultadoFinal').innerHTML=htmlResultado;
    document.getElementById('resultadoFinal').style.display='block';
    document.getElementById('areaProva').style.display='none';
  }else{alert('Redação corrigida acima!');}
}

function exportarPDF(notaQ){
  const data = new Date().toISOString().split('T')[0];
  const titulo = `CEDAF2029_Prova${provaAtual.id}_${provaAtual.tema.nomeClean}`.replace(/\s/g,'');
  document.title = `${titulo}_${data}`;
  window.print();
  setTimeout(()=>{document.title = 'CEDAF 2029 - Laura'}, 1000);
}

function exportarXLSX(notaQ){
  const data = new Date().toLocaleDateString('pt-BR');
  const titulo = `CEDAF2029_Prova${provaAtual.id}_${provaAtual.tema.nomeClean}`.replace(/\s/g,'');

  const wsResumo = XLSX.utils.aoa_to_sheet([
    ['Data', data],
    ['Prova', provaAtual.id],
    ['Tema', provaAtual.tema.nomeClean],
    ['Nota Prova', notaQ],
    ['Nota Redação', notaRedacao]
  ]);

  const dadosQuestoes = [['Questao','Sua Resposta','Gabarito','Status','Tipo']];
  respostas.forEach((r,i)=>{
    if(r&&r.confirmado){
      const q=provaAtual.questoes[i];const acertou=r.letra===q.gab?'Acerto':'Erro';
      dadosQuestoes.push([i+1,r.letra.toUpperCase(),q.gab.toUpperCase(),acertou,r.tipo]);
    }
  });
  const wsQuestoes = XLSX.utils.aoa_to_sheet(dadosQuestoes);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo');
  XLSX.utils.book_append_sheet(wb, wsQuestoes, 'Questoes');
  XLSX.writeFile(wb, `${titulo}_${new Date().toISOString().split('T')[0]}.xlsx`);
}

function exportarWhats(notaQ){
  const textoRedacao = document.getElementById('textoRedacao')?.value || '';
  const primeiraLinha = textoRedacao.split('\n')[0].substring(0,40) || provaAtual.tema.nomeClean;
  let texto=`*CEDAF 2029 - Laura*\nProva ${provaAtual.id}: ${provaAtual.tema.nomeClean}\nNota Prova: ${notaQ}/1000\nRedação: ${primeiraLinha}\nNota Redação: ${notaRedacao}/1000\n`;
  respostas.forEach((r,i)=>{if(r&&r.confirmado){const q=provaAtual.questoes[i];const acertou=r.letra===q.gab?'✅':'❌';
    texto+=`Q${i+1}: ${r.letra.toUpperCase()} ${acertou}\n`;}});
  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');
}

iniciar();
</script>
</body>
</html>
