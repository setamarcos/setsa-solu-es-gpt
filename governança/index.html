<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcos Governança</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <header>
            <h1>Marcos Governança</h1>
            <p id="data-atual"></p>
            <div id="timer-box">Janela de Foco: <span id="timer">03:00</span></div>
        </header>

        <section id="diario">
            <div class="card">
                <h3>🏠 Família & Essencial</h3>
                <label>Horas com Família (Mínimo 2h):</label>
                <input type="number" id="familia" step="0.5" placeholder="0.0">
                <label>Qualidade do Sono (1-10):</label>
                <input type="number" id="sono" min="1" max="10">
            </div>

            <div class="card">
                <h3>📈 Performance</h3>
                <label>Horas Produtivas:</label>
                <input type="number" id="produtiva" step="0.5" placeholder="0.0">
                <label>Horas Improdutivas:</label>
                <input type="number" id="improdutiva" step="0.5" placeholder="0.0">
            </div>

            <div class="card">
                <h3>💰 Financeiro (Entrou/Saiu)</h3>
                <input type="number" id="financeiro_in" placeholder="Entrou R$">
                <input type="number" id="financeiro_out" placeholder="Saiu R$" style="margin-top:10px">
            </div>

            <div class="card">
                <h3>📝 Diário de Obra</h3>
                <textarea id="diario_obra" rows="3" placeholder="Insights do dia..."></textarea>
            </div>

            <button id="btn-salvar" onclick="salvarDados()">SELAR CICLO DIÁRIO</button>
        </section>

        <section id="relatorio" class="card hidden">
            <h2>Ciclo Selado com Sucesso</h2>
            <div id="dados-visualizacao"></div>
            <p style="font-size: 0.8em; color: #94a3b8; margin-top: 15px;">O histórico foi gravado e é imutável.</p>
            <button onclick="window.location.reload()" style="margin-top:20px; background:#475569">NOVO LANÇAMENTO</button>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
