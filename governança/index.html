<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>MP Hub IA - Direto ao Ponto</title>
    <style>
        body { margin:0; font-family: Arial; background:#003366; color:#fff; text-align:center; }
        .container { background:#fff; color:#000; max-width:600px; margin:50px auto; padding:30px; border-radius:15px; }
        input { width:100%; padding:15px; font-size:18px; border:2px solid #ff6600; border-radius:8px; box-sizing:border-box; }
        .campos-dinamicos { margin-top:20px; text-align:left; }
        label { font-weight:bold; display:block; margin-top:10px; }
        button { background:#ff6600; color:#fff; border:none; padding:15px; width:100%; border-radius:8px; margin-top:20px; cursor:pointer; font-size:16px; }
        .resultado { background:#eef; padding:15px; margin-top:20px; border-radius:8px; white-space:pre-wrap; display:none; }
    </style>
</head>
<body>

    <h2>O que você quer resolver agora?</h2>
    <div class="container">
        <input type="text" id="comando" placeholder="Ex: recibo de 780, salvar casamento, cortar grama..." oninput="ajustarFluxo()">
        
        <div id="fluxo" class="campos-dinamicos"></div>
        
        <button onclick="executar()">Gerar Solução</button>
        <div id="saida" class="resultado"></div>
    </div>

<script>
function ajustarFluxo() {
    const cmd = document.getElementById('comando').value.toLowerCase();
    const fluxo = document.getElementById('fluxo');
    fluxo.innerHTML = ""; // Limpa

    if (cmd.includes("recibo") || cmd.includes("valor")) {
        fluxo.innerHTML = '<label>Nome do Pagador:</label><input id="d1"><label>Referente a:</label><input id="d2">';
    } 
    else if (cmd.includes("casamento") || cmd.includes("mulher") || cmd.includes("filha")) {
        fluxo.innerHTML = '<label>O que aconteceu por último?</label><textarea id="d1" style="width:100%"></textarea><label>Qual seu maior medo agora?</label><input id="d2">';
    }
    else if (cmd.includes("grama") || cmd.includes("piscina") || cmd.includes("obra")) {
        fluxo.innerHTML = '<label>Tamanho/Medida:</label><input id="d1"><label>Situação atual (Ex: suja, alta, torta):</label><input id="d2">';
    }
}

function executar() {
    const cmd = document.getElementById('comando').value;
    const d1 = document.getElementById('d1')?.value || "";
    const d2 = document.getElementById('d2')?.value || "";

    const prompt = `INTENÇÃO: ${cmd}\nDADO 1: ${d1}\nDADO 2: ${d2}\n\nINSTRUÇÃO: Responda de forma prática e utilizável agora. Sem introduções.`;[cite: 3]
    
    const saida = document.getElementById('saida');
    saida.innerText = prompt;
    saida.style.display = 'block';
}
</script>
</body>
</html>
