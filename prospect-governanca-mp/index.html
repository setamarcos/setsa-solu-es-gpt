<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospecção e Governança MP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="topo">
        <h1>Prospecção e Governança MP</h1>
        <p>Seta Soluções</p>
    </div>

    <div class="card">
        <input type="text" id="cliente" placeholder="Nome Cliente">
        <input type="text" id="telefone" placeholder="Telefone">

        <select id="tipo">
            <option value="CONSTRUTORA">CONSTRUTORA</option>
            <option value="ESCOLA">ESCOLA</option>
            <option value="COMERCIAL">COMERCIAL</option>
            <option value="OUTROS">OUTROS</option>
        </select>

        <textarea id="observacao" placeholder="Observação"></textarea>
        <input type="text" id="retorno" placeholder="Retorno / Data">

        <button onclick="salvarCliente()" id="btnSalvar">
            SALVAR CLIENTE
        </button>

        <button onclick="abrirWhatsapp()" class="btn-whatsapp" style="background-color: #25d366; margin-top: 10px;">
            FALAR NO WHATSAPP
        </button>

        <div id="status"></div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
