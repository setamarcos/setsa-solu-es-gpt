<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    <title>Painel de Crônicas - Seta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e3f2fd; padding: 20px; margin: 0; }
      .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .btn-voice { width: 100%; padding: 15px; margin: 10px 0; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; transition: 0.3s; }
      .btn-voice.recording { background: #dc3545; box-shadow: 0 0 10px rgba(220, 53, 69, 0.5); }
      .btn-save { width: 100%; padding: 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 10px; }
      .btn-save:disabled { background: #6c757d; }
        textarea { width: 100%; height: 300px; margin-bottom: 10px; background-color: #f9f9f9; padding: 15px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; line-height: 1.5; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        h2 { color: #0d47a1; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Painel de Crônicas - Seta</h2>
        <input type="text" id="titulo" placeholder="Título da Crônica">
        <button id="btn-titulo" class="btn-voice" onclick="toggleVoz('titulo', false)">🎙 Falar Título (Novo)</button>
        <textarea id="conteudo" placeholder="Inicie sua reflexão..."></textarea>
        <button id="btn-conteudo" class="btn-voice" onclick="toggleVoz('conteudo', true)">🎙 Falar Texto (Gravação Contínua)</button>
        <button class="btn-save" onclick="salvar()">💾 Salvar na Base de Dados</button>
    </div>

    <script>
        let recognition = null;
        let campoAtivo = null;
        let isRecording = false;
        let textoAcumulado = "";
        let timerParagrafo = null;

        function formatarInicial(texto) {
            if (!texto) return "";
            return texto.trim().charAt(0).toUpperCase() + texto.trim().slice(1);
        }

        function toggleVoz(campoId, cumulativo) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Microfone só funciona em HTTPS. Suba pro Github pra testar."); return; }

            // SE JÁ ESTÁ GRAVANDO: PARA. ISSO TRAVA O BUG DO VERMELHO
            if (isRecording) {
                pararGravacao();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = true;

            campoAtivo = campoId;
            isRecording = true;
            const campo = document.getElementById(campoId);
            const btn = document.getElementById('btn-' + campoId);

            if (!cumulativo) {
                campo.value = "";
                textoAcumulado = "";
            } else {
                textoAcumulado = campo.value;
            }

            btn.classList.add('recording');
            btn.innerText = "🔴 Gravando... (Clique para Parar / Pause 5s)";

            recognition.onresult = (event) => {
                clearTimeout(timerParagrafo);
                let textoNovo = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    textoNovo += event.results[i][0].transcript;
                }
                let textoCompleto = textoAcumulado + textoNovo;
                campo.value = formatarInicial(textoCompleto);

                // REGRA HUMANA: PAUSA 5S = PONTO + 2 ENTERS
                timerParagrafo = setTimeout(() => {
                    let val = campo.value.trim();
                    if (val &&!val.endsWith('.')) val += ".";
                    campo.value = val + "\n\n";
                    textoAcumulado = campo.value; // Trava o parágrafo
                }, 5000);
            };

            recognition.onend = () => {
                // Isso aqui só roda em HTTPS. Em local ele ignora
                pararGravacao();
            };
            recognition.start();
        }

        function pararGravacao() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            clearTimeout(timerParagrafo);
            isRecording = false;

            const btn = document.getElementById('btn-' + campoAtivo);
            if(btn) {
                btn.classList.remove('recording');
                btn.innerText = campoAtivo === 'conteudo'? "🎙 Falar Texto (Gravação Contínua)" : "🎙 Falar Título (Novo)";
            }
            // Garante ponto final
            let campo = document.getElementById(campoAtivo);
            if(campo && campo.value.trim()) {
                let val = campo.value.trim();
                if (!val.endsWith('.') &&!val.endsWith('!') &&!val.endsWith('?')) campo.value = val + ".";
            }
            campoAtivo = null;
        }

        function salvar() {
            if(isRecording) pararGravacao();
            const t = document.getElementById('titulo').value;
            const c = document.getElementById('conteudo').value;
            if (t.length < 3 || c.length < 10) { alert("Preencha título e texto."); return; }

            const url_api = "https://script.google.com/macros/s/AKfycbx0LF6BodLz3Q2LkUAm-yWvByBiTYHthkoo5tmUXv64WtwtWB6g2lHJV1dW7OmBgiA5LQ/exec";
            const btnSalvar = document.querySelector('.btn-save');
            btnSalvar.innerText = "⏳ Salvando no motor..."; btnSalvar.disabled = true;

            fetch(url_api, { method: 'POST', body: JSON.stringify({ titulo: t, conteudo: c }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }})
         .then(res => res.json())
         .then(data => {
                if(data.status === "sucesso") { alert('Crônica guardada com sucesso na sua base!'); document.getElementById('titulo').value = ''; document.getElementById('conteudo').value = ''; }
                else { alert('Falha no motor: ' + data.detalhe); }
            })
         .catch(err => alert("Erro de comunicação com a base."))
         .finally(() => { btnSalvar.innerText = "💾 Salvar na Base de Dados"; btnSalvar.disabled = false; });
        }
    </script>
</body>
</html>
