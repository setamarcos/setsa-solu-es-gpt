<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    <title>Painel de Crônicas - Seta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e3f2fd; padding: 20px; margin: 0; }
      .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .btn-voice { width: 100%; padding: 15px; margin: 10px 0; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; transition: 0.3s; }
      .btn-voice.recording { background: #dc3545; box-shadow: 0 0 10px rgba(220, 53, 69, 0.5); }
      .btn-save { width: 100%; padding: 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 10px; }
      .btn-save:disabled { background: #6c757d; cursor: not-allowed; }
        textarea { width: 100%; height: 300px; margin-bottom: 10px; background-color: #f9f9f9; padding: 15px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; line-height: 1.5; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        h2 { color: #0d47a1; text-align: center; margin-bottom: 20px; }
       .hint { font-size: 13px; color: #666; text-align: center; margin-top: -5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Painel de Crônicas - Seta</h2>

        <input type="text" id="titulo" placeholder="Título da Crônica">
        <button id="btn-titulo" class="btn-voice" onclick="iniciarVoz('titulo')">🎙 Falar Título (Novo)</button>

        <textarea id="conteudo" placeholder="Inicie sua reflexão..."></textarea>
        <p class="hint">Dica: Fale > Pare > Clique de novo. Ele cria parágrafo sozinho.</p>
        <button id="btn-conteudo" class="btn-voice" onclick="iniciarVoz('conteudo')">🎙 Falar Texto (Gravação Contínua)</button>

        <button class="btn-save" onclick="salvar()">💾 Salvar na Base de Dados</button>
    </div>

    <script>
        let recognition = null;
        let campoVozAtivo = null;

        function formatarFrase(texto) {
            if(!texto) return "";
            texto = texto.trim().toLowerCase();
            return texto.charAt(0).toUpperCase() + texto.slice(1);
        }

        function iniciarVoz(campoId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Seu navegador não suporta reconhecimento de voz. Use Chrome."); return; }

            if(recognition) recognition.stop(); // Para qualquer gravação anterior

            const campo = document.getElementById(campoId);
            const btn = document.getElementById('btn-' + campoId);
            campoVozAtivo = campoId;

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false; // IGUAL LAURA: Para sozinho em 2-3s de silêncio
            recognition.interimResults = false; // Só pega o resultado final

            btn.classList.add('recording');
            btn.innerText = "🔴 Ouvindo... (Fale e pare)";

            recognition.onresult = (event) => {
                const textoNovo = formatarFrase(event.results[0][0].transcript);

                if(campoId === 'titulo') {
                    campo.value = textoNovo; // Título substitui tudo
                }

                if(campoId === 'conteudo') {
                    let textoAtual = campo.value.trim();
                    // Se já tem texto, fecha parágrafo e inicia novo
                    if(textoAtual) {
                        if(!/[.!?]$/.test(textoAtual)) textoAtual += "."; // Garante ponto
                        campo.value = textoAtual + "\n\n" + textoNovo; // PULA 2 LINHAS
                    } else {
                        campo.value = textoNovo;
                    }
                }
                campo.scrollTop = campo.scrollHeight;
            };

            recognition.onend = () => {
                btn.classList.remove('recording');
                btn.innerText = campoId === 'conteudo'? "🎙 Falar Texto (Gravação Contínua)" : "🎙 Falar Título (Novo)";

                // Garante ponto final ao terminar
                let val = campo.value.trim();
                if(val &&!/[.!?]$/.test(val)) campo.value = val + ".";
            };

            recognition.onerror = (e) => {
                console.error("Erro de voz:", e.error);
                btn.classList.remove('recording');
                btn.innerText = campoId === 'conteudo'? "🎙 Falar Texto (Gravação Contínua)" : "🎙 Falar Título (Novo)";
            }
            recognition.start();
        }

        function salvar() {
            if(recognition) recognition.stop(); // Para voz antes de salvar
            const t = document.getElementById('titulo').value;
            const c = document.getElementById('conteudo').value;
            if (t.length < 3 || c.length < 10) { alert("Necessário preencher título e ter texto suficiente na crônica."); return; }

            const url_api = "https://script.google.com/macros/s/AKfycbx0LF6BodLz3Q2LkUAm-yWvByBiTYHthkoo5tmUXv64WtwtWB6g2lHJV1dW7OmBgiA5LQ/exec";
            const btnSalvar = document.querySelector('.btn-save');
            btnSalvar.innerText = "⏳ Salvando no motor...";
            btnSalvar.disabled = true;

            fetch(url_api, {
                method: 'POST',
                body: JSON.stringify({ titulo: t, conteudo: c }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
          .then(res => res.json())
          .then(data => {
                if(data.status === "sucesso") {
                    alert('Crônica guardada com sucesso na sua base!');
                    document.getElementById('titulo').value = '';
                    document.getElementById('conteudo').value = '';
                } else {
                    alert('Houve uma falha no motor: ' + data.detalhe);
                }
            })
          .catch(err => {
                alert("Erro de comunicação com a base de dados.");
                console.error(err);
            })
          .finally(() => {
                btnSalvar.innerText = "💾 Salvar na Base de Dados";
                btnSalvar.disabled = false;
            });
        }
    </script>
</body>
</html>
