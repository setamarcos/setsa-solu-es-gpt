<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e3f2fd; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .btn-voice { width: 100%; padding: 15px; margin: 10px 0; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-voice.recording { background: #dc3545; box-shadow: 0 0 10px rgba(220, 53, 69, 0.5); }
        
        .btn-save { width: 100%; padding: 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        
        textarea { width: 100%; height: 300px; margin-bottom: 10px; background-color: #f9f9f9; padding: 15px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; line-height: 1.5; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #0d47a1; text-align: center;">Painel de Crônicas - Seta</h2>
        
        <input type="text" id="titulo" placeholder="Título da Crônica">
        <button id="btn-titulo" class="btn-voice" onclick="iniciarVoz('titulo', false)">🎙 Falar Título (Novo)</button>
        
        <textarea id="conteudo" placeholder="Inicie sua reflexão..."></textarea>
        <button id="btn-conteudo" class="btn-voice" onclick="iniciarVoz('conteudo', true)">🎙 Falar Texto (Gravação Contínua)</button>
        
        <button class="btn-save" onclick="salvar()">💾 Salvar na Base de Dados</button>
    </div>

    <script>
        let timerParagrafo;
        let timerDesligar;
        let aguardandoNovoParagrafo = false;

        // Garante que a primeira letra seja maiúscula
        function formatarInicial(texto) {
            if (!texto) return "";
            texto = texto.trim();
            return texto.charAt(0).toUpperCase() + texto.slice(1);
        }

        function iniciarVoz(campoId, cumulativo) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Seu navegador não suporta reconhecimento de voz."); return; }

            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = false;
            
            const campo = document.getElementById(campoId);
            const btn = document.getElementById('btn-' + campoId);
            
            if (!cumulativo) campo.value = "";
            
            // Lógica de desligamento seguro
            const parar = () => { 
                recognition.stop(); 
                clearTimeout(timerParagrafo);
                clearTimeout(timerDesligar);
                btn.classList.remove('recording');
                btn.innerText = cumulativo ? "🎙 Falar Texto (Gravação Contínua)" : "🎙 Falar Título (Novo)";
            };

            recognition.onstart = () => {
                aguardandoNovoParagrafo = false;
                btn.classList.add('recording');
                btn.innerText = "🔴 Gravando... (Fale naturalmente)";
            };

            recognition.onresult = (event) => {
                // Zera os cronômetros ao ouvir a sua voz
                clearTimeout(timerParagrafo);
                clearTimeout(timerDesligar);

                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        transcript = event.results[i][0].transcript.trim();
                    }
                }

                if (transcript !== "") {
                    if (cumulativo && campo.value.trim() !== "") {
                        if (aguardandoNovoParagrafo) {
                            // Houve pausa de 3s: Adiciona ponto no anterior e pula linha dupla
                            let val = campo.value.trim();
                            if (!val.endsWith('.') && !val.endsWith('!') && !val.endsWith('?')) {
                                campo.value = val + ".";
                            }
                            campo.value += "\n\n" + formatarInicial(transcript);
                        } else {
                            // Não houve pausa longa: É a mesma frase, apenas adiciona espaço
                            campo.value += " " + transcript;
                        }
                    } else {
                        // É o primeiríssimo texto do campo
                        campo.value = formatarInicial(transcript);
                    }

                    aguardandoNovoParagrafo = false;

                    // Timer 1: 3 segundos em silêncio aciona o próximo parágrafo
                    timerParagrafo = setTimeout(() => {
                        aguardandoNovoParagrafo = true;
                    }, 3000);

                    // Timer 2: 6 segundos em silêncio desliga o microfone
                    timerDesligar = setTimeout(parar, 6000);
                }
            };

            recognition.onend = parar;

            // Inicia e já arma a contagem de 6s caso não fale nada no início
            recognition.start();
            timerDesligar = setTimeout(parar, 6000);
        }

        function salvar() {
            const t = document.getElementById('titulo').value;
            const c = document.getElementById('conteudo').value;
            
            if (t.length < 3 || c.length < 10) {
                alert("Necessário preencher título e ter texto suficiente na crônica.");
                return;
            }

            let textoFinal = c.trim();
            if (!textoFinal.endsWith('.') && !textoFinal.endsWith('!') && !textoFinal.endsWith('?')) {
                textoFinal += ".";
                document.getElementById('conteudo').value = textoFinal;
            }

            // === URL DO MOTOR APPS SCRIPT ===
            const url_api = "https://script.google.com/macros/s/AKfycbx0LF6BodLz3Q2LkUAm-yWvByBiTYHthkoo5tmUXv64WtwtWB6g2lHJV1dW7OmBgiA5LQ/exec";

            // Feedback visual enquanto salva
            const btnSalvar = document.querySelector('.btn-save');
            btnSalvar.innerText = "⏳ Salvando no motor...";
            btnSalvar.disabled = true;

            // Envia os dados para o Google Apps Script
            fetch(url_api, {
                method: 'POST',
                body: JSON.stringify({ titulo: t, conteudo: textoFinal }),
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                }
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "sucesso") {
                    alert('Crônica guardada com sucesso na sua base!');
                    document.getElementById('titulo').value = '';
                    document.getElementById('conteudo').value = '';
                } else {
                    alert('Houve uma falha no motor: ' + data.detalhe);
                }
            })
            .catch(error => {
                alert("Erro de comunicação com a base de dados.");
                console.error(error);
            })
            .finally(() => {
                btnSalvar.innerText = "💾 Salvar na Base de Dados";
                btnSalvar.disabled = false;
            });
        }
    </script>
</body>
</html>
