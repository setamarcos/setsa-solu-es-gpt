<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Álbum Editorial</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="img/logo-seta.png" alt="Logo" class="logo">
    <h1>Álbum Editorial Colecionável</h1>
  </header>

  <main>
    <section class="config">
      <label>Tema:
        <select id="tema">
          <option value="">Selecione</option>
          <option value="futebol">Futebol</option>
          <option value="escola">Escola</option>
          <option value="igreja">Igreja</option>
          <option value="casamento">Casamento</option>
          <option value="formatura">Formatura</option>
          <option value="empresa">Empresa</option>
          <option value="excursao">Excursão</option>
          <option value="livre">Livre</option>
        </select>
      </label>

      <label>Quantidade:
        <input id="qtde" type="number" value="12" min="1" max="12">
      </label>

      <label>História:
        <select id="historiaOpcao"></select>
      </label>

      <input id="titulo" type="text" placeholder="Título">
      <input id="subtitulo" type="text" placeholder="Subtítulo">
      <textarea id="historia" placeholder="História"></textarea>
      <input id="editorial" type="text" placeholder="Editorial">

      <label>Layout:
        <select id="layout">
          <option value="alinhado">Alinhado</option>
          <option value="solto">Solto</option>
          <option value="editavel">Editável</option>
        </select>
      </label>

      <label>Paleta:
        <input id="paleta" type="color" value="#ffffff">
      </label>

      <button onclick="gerarAlbum()">Gerar Álbum</button>
    </section>

    <section id="uploadGrid"></section>
    <section id="print-area"></section>

    <div id="printSelector" style="display:none;">
      <h3>Selecionar páginas para imprimir</h3>
      <div id="paginasCheck"></div>
      <button onclick="imprimirSelecionadas()">Imprimir</button>
      <button onclick="gerarCartela()">Gerar Cartela</button>
    </div>
  </main>

  <script src="js/automatizar.js"></script>
</body>
</html>
