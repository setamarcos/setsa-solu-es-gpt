<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Seta Soluções — Mentoria de Escrita</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root { --blue: #0b63c6; --orange: #ff7a18; --bg: #f0f4f8; --card: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; padding: 20px; }
        .container { max-width: 850px; width: 100%; background: var(--card); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; border-top: 8px solid var(--blue); }
        .header { background: white; padding: 30px; text-align: center; border-bottom: 1px solid #eee; }
        .seta-icon { font-size: 40px; color: var(--orange); margin-bottom: 10px; display: block; }
        .content { padding: 30px; }
        label { font-weight: bold; color: var(--blue); display: block; margin: 15px 0 5px; text-transform: uppercase; font-size: 12px; }
        select, textarea, input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e1e8ed; font-size: 15px; margin-bottom: 10px; transition: 0.3s; }
        select:focus, textarea:focus { border-color: var(--blue); outline: none; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        button { padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-main { background: var(--blue); color: white; }
        .btn-mentor { background: #1e293b; color: white; }
        .btn-save { background: var(--orange); color: white; }
        .btn-share { background: #25d366; color: white; grid-column: span 2; }
        #feedbackResult { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 15px; padding: 20px; margin-top: 25px; display: none; }
        .warning { color: #dc2626; background: #fee2e2; padding: 15px; border-radius: 10px; display: none; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="seta-icon">➜</span>
            <h1 style="margin:0; color: var(--blue);">Mentoria de Escrita Seta</h1>
            <p style="color: #64748b; margin: 5px 0;">Inteligência para educar, rigor para crescer.</p>
        </div>
        
        <div class="content">
            <label>Nível Acadêmico (Rigor Escalonado)</label>
            <select id="ano">
                <option value="6">6º Ano Fundamental</option>
                <option value="7">7º Ano Fundamental</option>
                <option value="8">8º Ano Fundamental</option>
                <option value="9">9º Ano Fundamental</option>
            </select>

            <button class="btn-main" style="width:100%" onclick="sortear()">🎲 Gerar Tema de Alto Nível</button>
            <div id="temaDisplay" style="margin-top:15px; font-weight:bold; color: var(--blue); text-align:center;"></div>

            <label>Evidência do Trabalho (Foto do Caderno)</label>
            <input type="file" accept="image/*" id="inputFoto" onchange="processar(this)">

            <label>Texto Identificado</label>
            <textarea id="textoRedacao" style="height: 120px;" placeholder="O mentor aguarda sua escrita..."></textarea>

            <div id="aviso" class="warning"></div>

            <div class="btn-grid">
                <button class="btn-mentor" onclick="analisar()">Ouvir o Mentor Sábio</button>
                <button class="btn-save" onclick="salvarPDF()">Gerar PDF de Entrega</button>
                <button id="btnZap" class="btn-share" style="display:none" onclick="mandarZap()">📲 Compartilhar com Comadres</button>
            </div>

            <div id="feedbackResult">
                <h3 style="margin-top:0; color: var(--blue);">Parecer Técnico:</h3>
                <div id="feedbackTexto" style="font-size: 14px; color: #334155; white-space: pre-wrap;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        function sortear() {
            const t = ["Ética na era da Inteligência Artificial", "O desafio da leitura crítica no século XXI", "Como o vocabulário define o futuro profissional"];
            document.getElementById('temaDisplay').innerText = t[Math.floor(Math.random()*t.length)];
        }

        async function processar(el) {
            const file = el.files[0];
            Tesseract.recognize(file, 'por').then(({ data: { text } }) => {
                document.getElementById('textoRedacao').value = text;
            });
        }

        function analisar() {
            const txt = document.getElementById('textoRedacao').value;
            const aviso = document.getElementById('aviso');
            const fBox = document.getElementById('feedbackResult');

            if(txt.length < 50) {
                aviso.innerText = "Você tentou, mas leia isso. Teria coragem de entregar este rascunho para alguém? O mentor exige esforço real.";
                aviso.style.display = "block";
                fBox.style.display = "none";
                return;
            }

            aviso.style.display = "none";
            fBox.style.display = "block";
            document.getElementById('feedbackTexto').innerText = "Análise de Aptidão:\n\nSua escrita apresenta uma estrutura básica, mas carece de conectivos lógicos. Para um aluno do " + document.getElementById('ano').value + "º ano, é esperado que você não apenas cite o tema, mas o defenda com argumentos sólidos e vírgulas bem posicionadas. Erros de concordância foram detectados e devem ser revisados imediatamente.\n\nO segundo parágrafo demonstra potencial, porém o vocabulário é repetitivo. Um texto sagaz utiliza sinônimos para manter o leitor atento. Se você deseja que suas ideias sejam levadas a sério, precisa tratar a gramática como sua principal ferramenta de poder. Não aceite o rascunho como versão final.\n\nPor fim, sua conclusão foi abrupta. Um sábio encerra seu pensamento reforçando o que foi dito, convidando à reflexão. Sugiro que releia em voz alta: se você se cansar ao ler, o leitor também se cansará. Corrija a pontuação e busque a excelência que sabemos que você pode atingir.";
            document.getElementById('btnZap').style.display = "block";
        }

        function salvarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Relatório de Redação - Seta Soluções", 10, 10);
            doc.text(document.getElementById('textoRedacao').value, 10, 20, {maxWidth: 180});
            doc.save("Redacao_Seta.pdf");
        }

        function mandarZap() {
            window.open("https://wa.me/?text=Veja a evolução da nossa escrita no Portal Seta!");
        }
    </script>
</body>
</html>
