<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laura 2.1.3f - Parecer de Redação</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
.container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.header { background: #1a73e8; color: #fff; padding: 16px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
.header h2 { margin: 0; font-size: 22px; }
#loginBox, #userInfo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 10px; }
#userInfo { display: none; }
#userImg { width: 36px; height: 36px; border-radius: 50%; }
.section { margin-bottom: 20px; }
label { font-weight: bold; display: block; margin-bottom: 6px; }
select, button, textarea { font-size: 16px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
.textarea-redacao { min-height: 160px; resize: vertical; }
button { background: #1a73e8; color: #fff; border: none; cursor: pointer; margin-top: 8px; }
button.btn-mentor { background: #34a853; }
button.btn-main { background: #ea4335; }
button.btn-login { background: #fbbc04; color: #000; }
.hint { font-size: 13px; color: #666; margin-top: 4px; }
.contador { font-size: 14px; color: #333; margin-top: 6px; }
#temaDisplay { background: #e8f0fe; padding: 10px; border-radius: 6px; margin-top: 10px; display: none; }
#resultadoAnalise { display: none; margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 6px; }
.nota { font-size: 32px; font-weight: bold; color: #1a73e8; }
.aviso { color: #d93025; font-size: 14px; margin-top: 6px; }
.parecer-box { background: #f8f9fa; padding: 15px; border-radius: 6px; border-left: 4px solid #1a73e8; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>Laura - Mentoria de Redação</h2>
    <div id="loginBox" style="display:none;">
      <div id="g_id_onload" data-client_id="1097002227710-uqa72og3t9t6lena1gdpakrm7f0vob78.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
    </div>
    <div id="userInfo">
      <img id="userImg" src="" alt="foto">
      <span id="userName"></span>
      <button onclick="logoutGoogle()">Sair</button>
    </div>
    <button id="btnAtivarLogin" class="btn-login" onclick="ativarLogin()">🔒 Ativar Login Google</button>
  </div>

  <div id="mainContent">

    <div class="section">
      <label>Série/Ano</label>
      <select id="ano" onchange="sortearTema()">
        <option value="5">5º ano</option>
        <option value="6" selected>6º ano</option>
        <option value="7">7º ano</option>
        <option value="8">8º ano</option>
        <option value="9">9º ano</option>
      </select>
      <button onclick="sortearTema()">🎲 Sortear Tema</button>
      <div id="temaDisplay"></div>
    </div>

    <div class="section">
      <label>1. FOTO DO CADERNO</label>
      <input type="file" id="inputFoto" accept="image/*">
      <button class="btn-mentor" onclick="salvarFoto()">📷 Salvar Foto</button>
      <p class="hint">A foto é só registro.</p>
    </div>

    <div class="section">
      <label>2. COLE O TEXTO TRANSCRITO PELA IA</label>
      <textarea id="textoIA" placeholder="Cole aqui o texto que a IA transcreveu da foto..." class="textarea-redacao"></textarea>
    </div>

    <div class="section">
      <label>3. TEXTO DA REDAÇÃO</label>
      <p class="hint">Copie do campo acima ou use os botões de voz. 3s de silêncio para parar.</p>
      <textarea id="textoRedacao" placeholder="Cole da IA ou use os botões de voz..." class="textarea-redacao"></textarea>
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button type="button" id="btnVozTitulo" class="btn-mentor" style="flex:1;">🎤 Título</button>
        <button type="button" id="btnVozParagrafo" class="btn-mentor" style="flex:1;">🎤 Parágrafo</button>
      </div>
      <div class="contador">
        <span id="contPalavras">0</span> palavras |
        <span id="contFrases">0</span> frases |
        <span id="contParafos">0</span> parágrafos
      </div>
      <p id="statusVoz" class="hint" style="margin-top:4px;"></p>
      <p id="avisoValidacao" class="aviso"></p>
    </div>

    <div class="section">
      <button class="btn-main" onclick="analisarRedacao()">📊 ANÁLISE COMPLETA</button>
    </div>

    <div id="resultadoAnalise">
      <h3>Parecer Técnico do Mentor</h3>
      <div class="parecer-box">
        <p class="nota">Nota: <span id="notaFinal">-</span></p>
        <div id="validacoesTexto"></div>
        <div id="errosTexto"></div>
        <div id="analisaEstrutura"></div>
        <div id="orientacoesTexto"></div>
        <div id="comentariosTexto"></div>
        <div id="resumoTexto"></div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
        <button onclick="exportarPDF()">📄 Gerar PDF</button>
        <button onclick="exportarXLS()">📊 Exportar XLS</button>
        <button onclick="compartilharWhatsApp()">💬 WhatsApp</button>
        <button class="btn-main" onclick="novaRedacao()">🗑️ Nova Redação</button>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
