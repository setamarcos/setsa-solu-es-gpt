<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Redações da Laura — Seta Soluções</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0b63c6; --orange: #ff7a18; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: "Inter", sans-serif; background: var(--bg); color: var(--text); margin: 20px; }
        .wrap { max-width: 900px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .logo { width: 60px; height: 60px; border-radius: 12px; background: linear-gradient(45deg, var(--blue), var(--orange)); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #64748b; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 15px; font-size: 15px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        button { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--blue); color: white; }
        .btn-accent { background: var(--orange); color: white; }
        .btn-ia { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .btn-ghost { background: #f1f5f9; color: #475569; }
        #ocrStatus { font-size: 13px; color: var(--blue); margin-top: -10px; margin-bottom: 15px; }
        .preview-img { max-width: 200px; border-radius: 8px; margin-top: 10px; display: none; border: 2px solid #e2e8f0; }
        .feedback-box { background: #fff7ed; border: 1px solid #ffedd5; padding: 15px; border-radius: 12px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="logo">MP</div>
            <div>
                <h1 style="margin:0; font-size: 22px;">Portal de Redação — Laura & Amigos</h1>
                <p style="margin:0; color: #64748b; font-size: 14px;">Transformando escrita em descoberta e prazer.</p>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <label>Série Escolar</label>
                    <select id="anoEscolar">
                        <option value="5º Ano">5º Ano</option>
                        <option value="6º Ano">6º Ano</option>
                        <option value="Outro">Outros anos...</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label>Data</label>
                    <input type="date" id="dataRedacao">
                </div>
            </div>

            <button class="btn-primary" onclick="sortearTema()">🎲 Sortear Tema Encantador</button>
            <div id="temaAtual" class="feedback-box" style="display:none; font-weight: 600; color: var(--blue);"></div>

            <label style="margin-top:20px;">Foto do Caderno (Humano)</label>
            <input type="file" id="fotoInput" accept="image/*" onchange="processarFoto(this)">
            <div id="ocrStatus">Aguardando imagem...</div>
            <img id="preview" class="preview-img">

            <label style="margin-top:20px;">Texto Extraído pela IA</label>
            <textarea id="textoRedacao" placeholder="O texto aparecerá aqui após a foto..."></textarea>

            <div class="btn-group">
                <button class="btn-ia" onclick="gerarFeedbackIA()">✨ Sugerir Elogio IA (Sutil)</button>
                <button class="btn-accent" onclick="salvarRedacao()">💾 Salvar na Nuvem Local</button>
            </div>

            <div id="areaFeedback" style="display:none;" class="feedback-box">
                <label>Feedback Sugerido (Aprendizagem sem Trauma):</label>
                <textarea id="campoFeedback" style="height: 100px; background: white;"></textarea>
            </div>
        </div>

        <div class="btn-group" style="justify-content: center;">
            <button class="btn-ghost" onclick="gerarPDF()">⬇️ Baixar PDF para o Grupo</button>
            <button class="btn-ghost" onclick="window.location.reload()">✖ Limpar Tudo</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
    <script>
        const temas = ["Minha maior aventura imaginária", "O que eu faria se fosse invisível por um dia", "Uma conversa com meu animal de estimação", "O mundo daqui a 100 anos"];
        
        function sortearTema() {
            const t = temas[Math.floor(Math.random() * temas.length)];
            const box = document.getElementById('temaAtual');
            box.innerText = "Tema: " + t;
            box.style.display = "block";
        }

        async function processarFoto(input) {
            const file = input.files[0];
            if (!file) return;
            
            document.getElementById('ocrStatus').innerText = "IA lendo o caderno... (aguarde)";
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = "block";
                Tesseract.recognize(e.target.result, 'por').then(({ data: { text } }) => {
                    document.getElementById('textoRedacao').value = text;
                    document.getElementById('ocrStatus').innerText = "Leitura concluída com sucesso!";
                });
            };
            reader.readAsDataURL(file);
        }

        function gerarFeedbackIA() {
            const texto = document.getElementById('textoRedacao').value;
            if (!texto) return alert("A IA precisa do texto para elogiar!");
            
            document.getElementById('areaFeedback').style.display = "block";
            document.getElementById('campoFeedback').value = "Que texto maravilhoso! Notei que você trouxe ideias muito criativas. Gostei especialmente de como você organizou o início. Uma dica preciosa: que tal usarmos mais 'palavras de ouro' como esta que você escolheu? Continue assim!";
        }

        function salvarRedacao() {
            alert("Redação guardada com carinho! Agora você pode compartilhar com as comadres.");
        }
    </script>
</body>
</html>
