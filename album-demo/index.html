<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Álbum IA Premium</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <img src="img/logo-seta.png" alt="Logo" class="logo">
  <h1>Álbum Editorial Premium</h1>
</header>

<main>
  <section class="config">
    <label>Segmento:
      <select id="segmento">
        <option value="academia">Academia</option>
        <option value="igreja">Igreja</option>
        <option value="escola">Escola</option>
        <option value="empresa">Empresa</option>
        <option value="bar">Bar</option>
        <option value="livre">Livre</option>
      </select>
    </label>

    <label>Região:
      <select id="regiao">
        <option value="rural">Rural</option>
        <option value="periferia">Periferia</option>
        <option value="centro">Centro</option>
        <option value="nobre">Nobre</option>
      </select>
    </label>

    <label>Nome do Local:
      <input id="nomeLocal" type="text" placeholder="Ex: Arena Betim">
    </label>

    <label>Cidade:
      <input id="cidade" type="text" placeholder="Ex: Betim MG">
    </label>

    <label>Tempo de existência:
      <input id="tempo" type="text" placeholder="Ex: 12 anos">
    </label>

    <button onclick="gerarAlbum()">Gerar Álbum Demonstrativo</button>
  </section>

  <section id="print-area"></section>
</main>

<script src="js/automatizar.js"></script>
</body>
</html>
