<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico Direto 5.0 - Seta Soluções</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#003366; color:#fff; padding-bottom: 30px; }
    .container { background:#fff; color:#000; max-width:600px; margin:20px auto; padding:20px; border-radius:12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h1 { text-align:center; color:#003366; font-size:22px; margin-bottom:5px; }
    .subtitle { text-align:center; color:#ff6600; font-size:13px; font-weight:bold; margin-bottom:20px; }
    
    /* Box do Login Verde herdado da interface anterior */
    #login { margin-bottom: 20px; }
    
    label { display: block; font-size:14px; font-weight:bold; margin-top: 15px; color: #003366; }
    textarea, select, input { width:100%; padding:10px; font-size:14px; border-radius:6px; border:1px solid #ccc; margin-bottom:10px; box-sizing: border-box; }
    textarea { min-height: 70px; }
    
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .checkbox-btn { background:#e2e8f0; color:#334155; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:bold; cursor:pointer; user-select:none; }
    .checkbox-btn.active { background:#ff6600; color:#fff; }
    
    .btn-audio { background:#002244; color:#fff; border:none; padding:10px; font-size:13px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; margin-bottom:10px; }
    
    .button-row { display:flex; gap:8px; margin-top:15px; }
    button.action-btn { flex:1; background:#ff6600; color:#fff; border:none; padding:12px; font-size:14px; border-radius:6px; cursor:pointer; font-weight:bold; }
    button.action-btn:hover { opacity:0.9; }
    
    .prompt-output { background:#f1f5f9; padding:12px; margin-top:15px; border-radius:6px; font-size:13px; border-left:4px solid #ff6600; white-space:pre-wrap; display:none; }
    
    .ia-response-box { margin-top:20px; background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #cbd5e1; }
    .feedback-buttons { display:flex; gap:8px; margin-top:10px; }
    .fb-btn { flex:1; padding:8px; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; color:#fff; }
    .fb-btn.yes { background:#16a34a; }
    .fb-btn.no { background:#dc2626; }
    .fb-btn.missing { background:#ca8a04; }
    
    .footer-btn { background:#002244; color:#fff; border:none; padding:10px; font-size:13px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; margin-top:10px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Estamos juntos nisso.</h1>
    <div class="subtitle">Refine sua intenção: Garanta respostas precisas da IA eliminando alucinações e desvios de escopo.</div>
    
    <div id="login"></div>
    
    <label for="solicitacao">1. Sua Solicitação (O que você quer que a IA faça?)</label>
    <button class="btn-audio" type="button" onclick="window.toggleGravacao?window.toggleGravacao():alert('Microfone ativo e integrado.')">🎤 Gravar Instrução por Áudio (Toque para Iniciar)</button>
    <textarea id="solicitacao" placeholder="Ex: Escreva uma mensagem curta de incentivo para minha filha..."></textarea>
    
    <label for="detalhe">2. O que deseja detalhar? (Contexto ou Histórico adicional)</label>
    <textarea id="detalhe" placeholder="Adicione fatos ou dados extras que ajudam a clarear o cenário atual..."></textarea>
    
    <label>3. O que você quer EVITAR? (Assim você evitará respostas sem sentido)</label>
    <div class="checkbox-group">
      <div class="checkbox-btn" onclick="this.classList.toggle('active')">⬜ Sem enrolação</div>
      <div class="checkbox-btn" onclick="this.classList.toggle('active')">⬜ Foco Prático</div>
      <div class="checkbox-btn" onclick="this.classList.toggle('active')">⬜ Uso no Celular</div>
      <div class="checkbox-btn" onclick="this.classList.toggle('active')">⬜ Linguagem Simples</div>
    </div>
    <textarea id="evitar" placeholder="Escreva o que está fora de cogitação..."></textarea>
    
    <label for="imagem">4. Se quiser inserir imagem (Print de tela ou Notícia):</label>
    <input type="file" id="imagem" accept="image/*" style="display:none;" onchange="document.getElementById('img-status').innerText='Imagem carregada para o ecossistema'">
    <button class="btn-audio" type="button" style="background:#e2e8f0; color:#000; border:2px dashed #cbd5e1;" onclick="document.getElementById('imagem').click()">Toque aqui para selecionar uma imagem do seu Android</button>
    <small id="img-status" style="display:block; color:#64748b; margin-top:-5px; margin-bottom:10px; font-weight:bold;"></small>
    
    <label for="objetivo_imagem">Qual o objetivo desse print/imagem?</label>
    <select id="objetivo_imagem">
      <option value="conversar">É o print de uma conversa (Quero uma resposta/retorno)</option>
      <option value="erro">É o print de um erro de sistema (Quero solução)</option>
      <option value="dados">Contém dados e tabelas para análise</option>
    </select>
    
    <div class="button-row">
      <button class="action-btn" type="button" onclick="gerarPromptEstruturado()">Me ajuda com isso</button>
      <button class="action-btn" type="button" onclick="copiarPromptGerado()">Copiar Prompt</button>
      <button class="action-btn" type="button" onclick="exportarDadosPlanilha()">Exportar CSV</button>
    </div>
    
    <div class="prompt-output" id="prompt-final"></div>
    
    <div class="ia-response-box">
      <label for="resposta_ia" style="margin-top:0;">5. Cole aqui o retorno que a IA te deu:</label>
      <textarea id="resposta_ia" placeholder="Cole a resposta gerada pelo ChatGPT, Gemini ou Copilot para registrar o feedback..."></textarea>
      
      <div class="feedback-buttons">
        <button class="fb-btn yes" type="button" onclick="registrarFeedback('Acertou')">👍 Acertou o Escopo</button>
        <button class="fb-btn no" type="button" onclick="registrarFeedback('Errou')">👎 Errou (Enrolou/Alucinou)</button>
        <button class="fb-btn missing" type="button" onclick="registrarFeedback('Faltou Contexto')">⚠️ Faltou Contexto</button>
      </div>
      
      <button class="footer-btn" type="button" onclick="copiarRelatorioFeedback()">Copiar Relatório de Feedback</button>
      <button class="footer-btn" type="button" style="background:#0284c7;" onclick="window.location.reload()">Continuar interação</button>
    </div>

  </div>

  <script src="google.js"></script>
  <script src="script.js"></script>
  
  <script>
    function gerarPromptEstruturado() {
      let solicitacao = document.getElementById('solicitacao').value;
      let detalhe = document.getElementById('detalhe').value;
      let evitar = document.getElementById('evitar').value;
      
      let filtros = [];
      document.querySelectorAll('.checkbox-btn.active').forEach(b => {
        filtros.push(b.innerText.replace('⬜ ', ''));
      });
      
      let prompt = `ASSUNTO: Diagnóstico / Solicitação Directa\\n`;
      prompt += `ENTRADA 1 (SOLICITAÇÃO): ${solicitacao}\\n`;
      prompt += `ENTRADA 2 (O QUE DESEJA): ${detalhe}\\n`;
      prompt += `ENTRADA 3 (O QUE NÃO QUER / EVITAR): ${evitar} [Restrições: ${filtros.join(', ')}]\\n`;
      prompt += `INSTRUÇÃO: Responder de forma direta, prática e sem excesso.\\n`;
      
      let painel = document.getElementById('prompt-final');
      painel.innerText = prompt;
      painel.style.display = 'block';
    }

    function copiarPromptGerado() {
      let texto = document.getElementById('prompt-final').innerText;
      if(!texto) { alert('Clique em Me ajuda com isso primeiro!'); return; }
      navigator.clipboard.writeText(texto);
      alert('Prompt estruturado copiado!');
    }

    function exportarDadosPlanilha() {
      if(window.salvarNoGoogleSheets) {
        window.salvarNoGoogleSheets();
      } else {
        let csvContent = "data:text/csv;charset=utf-8,Data,Solicitacao,Tipo Midia\\n";
        csvContent += `"${new Date().toLocaleString()}", "${document.getElementById('solicitacao').value.substring(0,50)}", "Interface Web"\\n`;
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "historico_diagnostico.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    function registrarFeedback(status) {
      if(window.enviarFeedbackPlanilha) {
        window.enviarFeedbackPlanilha(status);
      } else {
        alert('Feedback "' + status + '" processado localmente no histórico.');
      }
    }

    function copiarRelatorioFeedback() {
      let resp = document.getElementById('resposta_ia').value;
      navigator.clipboard.writeText("Relatório de Feedback: " + resp);
      alert('Feedback copiado!');
    }
  </script>
</body>
</html>
