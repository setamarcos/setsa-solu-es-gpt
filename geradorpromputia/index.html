<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico Direto 5.5 - Seta Soluções</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#003366; color:#fff; padding-bottom: 30px; }
  .container { background:#fff; color:#000; max-width:600px; margin:20px auto; padding:20px; border-radius:12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h1 { text-align:center; color:#003366; font-size:22px; margin-bottom:5px; }
  .subtitle { text-align:center; color:#ff6600; font-size:13px; font-weight:bold; margin-bottom:20px; }

    #login { margin-bottom: 20px; padding: 15px; background: #f1f5f9; border-radius: 8px; }
    #login input { width: 100%; display: block; margin-bottom:8px; }
    #login button { width: 100%; display: block; background:#16a34a; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; }

    label { display: block; font-size:14px; font-weight:bold; margin-top: 15px; color: #003366; }
    textarea, input { width:100%; padding:10px; font-size:14px; border-radius:6px; border:1px solid #ccc; margin-bottom:10px; box-sizing: border-box; }
    textarea { min-height: 70px; }

  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .checkbox-btn { background:#e2e8f0; color:#334155; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:bold; cursor:pointer; user-select:none; }
  .checkbox-btn.active { background:#ff6600; color:#fff; }

  .btn-audio { background:#002244; color:#fff; border:none; padding:10px; font-size:13px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; margin-bottom:10px; }
  .btn-audio.gravando { background:#cc0000; }

  .button-row { display:flex; gap:6px; margin-top:15px; }
    button.action-btn { flex:1; background:#ff6600; color:#fff; border:none; padding:12px; font-size:13px; border-radius:6px; cursor:pointer; font-weight:bold; }

  .prompt-output { background:#f1f5f9; padding:12px; margin-top:15px; border-radius:6px; font-size:13px; border-left:4px solid #ff6600; white-space:pre-wrap; display:none; color:#000; }
  
  .ia-response-box { margin-top:20px; background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #cbd5e1; }
  .footer-btn { background:#002244; color:#fff; border:none; padding:10px; font-size:13px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; margin-top:10px; }

  </style>
</head>
<body>

  <div class="container">
    <h1>Estamos juntos nisso.</h1>
    <div class="subtitle">Refine sua intenção: Garanta respostas precisas da IA</div>

    <div id="login"></div>

    <label for="solicitacao">1. Sua Solicitação</label>
    <button id="mic-solicitacao" class="btn-audio" type="button" onclick="gerenciarAudio('solicitacao', this)">🎤 Gravar Solicitação</button>
    <textarea id="solicitacao"></textarea>

    <label for="detalhe">2. O que deseja detalhar?</label>
    <button id="mic-detalhe" class="btn-audio" type="button" onclick="gerenciarAudio('detalhe', this)">🎤 Gravar Detalhes</button>
    <textarea id="detalhe"></textarea>

    <label>3. O que você quer EVITAR?</label>
    <div class="checkbox-group">
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'Não quero texto longo ou enrolação.')">⬜ Sem enrolação</div>
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'Evite teoria excessiva, foque em passos práticos.')">⬜ Foco Prático</div>
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'A solução não deve depender de computador, opero apenas via celular.')">⬜ Uso no Celular</div>
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'Não traga termos técnicos complexos, simplifique a linguagem.')">⬜ Linguagem Simples</div>
    </div>
    <textarea id="evitar"></textarea>

    <div class="button-row">
      <button class="action-btn" type="button" onclick="gerarPromptEstruturado()">Me ajuda com isso</button>
      <button class="action-btn" type="button" onclick="copiarPromptGerado()">Copiar Prompt</button>
    </div>

    <div class="prompt-output" id="prompt-final"></div>

    <div class="ia-response-box">
      <label for="resposta_ia">5. Cole aqui o retorno que a IA te deu:</label>
      <textarea id="resposta_ia"></textarea>
      <button class="footer-btn" type="button" onclick="copiarRelatorioFeedback()">Copiar Relatório de Feedback</button>
      <button class="footer-btn" type="button" style="background:#0284c7;" onclick="window.location.reload()">Continuar interação</button>
    </div>

  </div>

<script>
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwAFjbqPdEk5rcgQahgsOn35tPXpTIj9vjSIA63LgyYDPj2QOvMB4K-kNGrkqscmYzp/exec";
let usuarioTelefone = localStorage.getItem('promptTelefone') || null;
let reconhecimentoAudio;
let campoGravandoId = null;

// LOGIN
function formatarTelefone(valor) {
  valor = valor.replace(/\D/g, "");
  if (valor.length <= 2) return `(${valor}`;
  if (valor.length <= 7) return `(${valor.slice(0,2)}) ${valor.slice(2)}`;
  return `(${valor.slice(0,2)}) ${valor.slice(2,7)}-${valor.slice(7,11)}`;
}
function fazerLoginPrompt() {
  const telInput = document.getElementById('telefoneInput').value.trim();
  if(telInput.replace(/\D/g, "").length === 11){
    usuarioTelefone = telInput;
    localStorage.setItem('promptTelefone', telInput);
    carregarLogin();
  } else { alert("Telefone inválido. Use (xx) xxxxx-xxxx") }
}
function fazerLogoutPrompt() {
  usuarioTelefone = null;
  localStorage.removeItem('promptTelefone');
  carregarLogin();
}
function carregarLogin() {
  if(usuarioTelefone) {
    document.getElementById('login').innerHTML = `<p style="color:#16a34a; font-weight:bold">✅ Logado: ${usuarioTelefone} <button onclick="fazerLogoutPrompt()">Sair</button></p>`;
  } else {
    document.getElementById('login').innerHTML = `<input type="text" id="telefoneInput" placeholder="(xx) xxxxx-xxxx" maxlength="15" oninput="this.value = formatarTelefone(this.value)"><button class="action-btn" onclick="fazerLoginPrompt()">Fazer Login</button>`;
  }
}

// SALVAR
function salvarNoGoogleSheets() {
  if (!usuarioTelefone) { alert("⚠️ Faça login primeiro!"); return; }
  const dados = {
    data: new Date().toLocaleString("pt-BR"),
    telefone: usuarioTelefone,
    solicitacao: document.getElementById('solicitacao').value,
    detalhe: document.getElementById('detalhe').value,
    evitar: document.getElementById('evitar').value,
    promptGerado: document.getElementById('prompt-final')?.innerText || "",
    respostaIA: document.getElementById('resposta_ia')?.value || ""
  };
  fetch(URL_APPS_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) })
  .then(() => alert("✅ Salvo na Planilha Mestre!"));
}

// AUDIO E FILTROS
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechGen = window.SpeechRecognition || window.webkitSpeechRecognition;
  reconhecimentoAudio = new SpeechGen();
  reconhecimentoAudio.lang = 'pt-BR';
  reconhecimentoAudio.onresult = function(event) {
    if (campoGravandoId) {
      document.getElementById(campoGravandoId).value += " " + event.results[0][0].transcript;
    }
  };
  reconhecimentoAudio.onend = pararGravacaoUI;
}
function gerenciarAudio(idCampo, botao) {
  if (!reconhecimentoAudio) { alert("Voz não suportada"); return; }
  if (campoGravandoId === idCampo) { reconhecimentoAudio.stop(); } 
  else { pararGravacaoUI(); campoGravandoId = idCampo; botao.classList.add('gravando'); botao.innerText = "🛑 Gravando..."; reconhecimentoAudio.start(); }
}
function pararGravacaoUI() {
  document.querySelectorAll('.btn-audio').forEach(btn => { btn.classList.remove('gravando'); btn.innerText = "🎤 Gravar"; });
  campoGravandoId = null;
}
function toggleFiltro(elemento, texto) {
  elemento.classList.toggle('active');
  const campoEvitar = document.getElementById('evitar');
  if (elemento.classList.contains('active')) { campoEvitar.value += "\n" + texto; elemento.innerText = elemento.innerText.replace('⬜', '✅'); } 
  else { campoEvitar.value = campoEvitar.value.replace(texto, "").trim(); elemento.innerText = elemento.innerText.replace('✅', '⬜'); }
}

// GERAR
function gerarPromptEstruturado() {
  salvarNoGoogleSheets();
  let prompt = `O QUE EU ENTENDI DO SEU PEDIDO:\n${document.getElementById('solicitacao').value}\n\n`;
  prompt += `CONTEXTO QUE VOCÊ ME DEU:\n${document.getElementById('detalhe').value}\n\n`;
  prompt += `O QUE VOCÊ PEDIU PRA EU EVITAR:\n${document.getElementById('evitar').value || "Nenhuma restrição"}\n\n`;
  prompt += `O QUE EU TE ENTREGUEI ASSIM:\nResposta direta, sem enrolação, focada em resolver sua solicitação acima.`;
  document.getElementById('prompt-final').innerText = prompt;
  document.getElementById('prompt-final').style.display = 'block';
}
function copiarPromptGerado() {
  navigator.clipboard.writeText(document.getElementById('prompt-final').innerText);
  alert('Prompt copiado!');
}
function copiarRelatorioFeedback() {
  navigator.clipboard.writeText(document.getElementById('prompt-final').innerText);
  alert('Relatório copiado!');
}

document.addEventListener('DOMContentLoaded', carregarLogin);
</script>
</body>
</html>
