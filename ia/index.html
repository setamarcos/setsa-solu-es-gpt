<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MP Hub IA</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: 'Roboto', sans-serif;
  background:#003366;
  color:#fff;
}

header {
  text-align:center;
  padding:1.5rem;
}

.container {
  background:#fff;
  color:#000;
  max-width:800px;
  margin:20px auto;
  padding:20px;
  border-radius:10px;
}

textarea {
  width:100%;
  padding:10px;
  font-size:16px;
}

button {
  background:#ff6600;
  color:#fff;
  border:none;
  padding:12px;
  border-radius:6px;
  margin-top:10px;
  cursor:pointer;
}

.result {
  margin-top:15px;
  padding:10px;
  background:#eef;
  white-space:pre-wrap;
}

.erro {
  color:red;
}
</style>
</head>

<body>

<header>
<p>Estamos juntos nisso.</p>
<p>Fala do seu jeito — eu organizo.<br>
Simples ou mais a fundo, a gente resolve.</p>
</header>

<div class="container">

<textarea id="entrada" placeholder="O que tá pegando?"></textarea>

<button onclick="processar()">Me ajuda com isso</button>
<button onclick="copiar()">Copiar</button>

<div class="result" id="saida"></div>

</div>

<script>

let textoFinal = "";

function detectarModo(texto){
  if(texto.length < 40) return "direto";
  if(texto.match(/erro|problema|não funciona/i)) return "técnico";
  return "organizar";
}

function corrigirTexto(texto){
  const erros = {
    "automativo":"automático",
    "expliccar":"explicar",
    "exesso":"excesso",
    "semelhancia":"semelhança"
  };

  let resultado = texto;

  for(let errado in erros){
    let regex = new RegExp(errado,"gi");
    resultado = resultado.replace(regex, `<span class="erro">${errado}</span>`);
  }

  return resultado;
}

function processar(){

let texto = entrada.value;

let modo = detectarModo(texto);

textoFinal = `
ENTRADA:
${texto}

MODO:
${modo}

INSTRUÇÃO:
Responder de forma direta, prática e sem excesso.
Focar no problema principal.
`;

saida.innerHTML = corrigirTexto(textoFinal);
}

function copiar(){
navigator.clipboard.writeText(textoFinal);
alert("Copiado");
}

</script>

</body>
</html>
