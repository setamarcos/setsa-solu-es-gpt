<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MP Hub IA - Final</title>
<style>
body { font-family: Arial; padding:20px; background:#f5f5f5; }
.container { background:#fff; padding:20px; border-radius:10px; max-width:900px; margin:auto; }
input, select, textarea { width:100%; margin-bottom:10px; padding:8px; }
button { padding:10px; margin:5px; cursor:pointer; }
.result { background:#eef; padding:10px; margin-top:15px; border-radius:5px; white-space:pre-wrap; }
.preview { margin-top:10px; max-width:100%; }
</style>
</head>
<body>

<div class="container">
<h2>MP Hub IA - Final</h2>

<label>Tipo:</label>
<select id="tipo">
<option>Pessoal</option>
<option>Técnica</option>
<option>Comercial</option>
<option>Casa</option>
<option>Outros</option>
</select>

<label>Subtipo:</label>
<input id="subtipo">

<label>Contexto:</label>
<textarea id="contexto"></textarea>

<label>Dúvida:</label>
<textarea id="duvida"></textarea>

<label>Motivo:</label>
<textarea id="motivo"></textarea>

<label>Objetivo:</label>
<textarea id="objetivo"></textarea>

<label>Resultado Esperado:</label>
<textarea id="resultadoEsperado"></textarea>

<label>O que NÃO quero:</label>
<textarea id="naoQuero"></textarea>

<label>IA:</label>
<select id="ia">
<option>ChatGPT</option>
<option>Gemini</option>
<option>Copilot</option>
</select>

<label>Imagem:</label>
<input type="file" id="imagem" accept="image/*">
<img id="preview" class="preview"/>

<button onclick="enviar()">Enviar</button>
<button onclick="copiar()">Copiar Prompt</button>
<button onclick="exportar()">Exportar JSON</button>

<div class="result" id="resultado"></div>

</div>

<script>
let banco = JSON.parse(localStorage.getItem("mpHub")) || [];
let promptFinal = "";

imagem.onchange = evt => {
    const [file] = imagem.files;
    if (file) preview.src = URL.createObjectURL(file);
};

function analisarEstado(tipo, contexto) {
    if (!contexto || contexto.length < 20) return "Contexto insuficiente — refine antes de prosseguir";

    if (tipo === "Pessoal") return "Falta de clareza / risco de dispersão";
    if (tipo === "Técnica") return "Execução técnica em andamento";
    if (tipo === "Comercial") return "Oportunidade com potencial de fechamento";
    if (tipo === "Casa") return "Demanda doméstica ativa";
    return "Em análise";
}

function gerarSugestao(tipo, objetivo, contexto) {
    if (!contexto || contexto.length < 20) {
        return "Refine o contexto para obter uma sugestão válida.";
    }

    if (tipo === "Pessoal") {
        return "Reduzir dispersão, definir foco único e executar com clareza.";
    }

    if (tipo === "Técnica") {
        return "Organizar escopo técnico e partir para execução direta.";
    }

    if (tipo === "Comercial") {
        return "Estruturar proposta clara visando fechamento.";
    }

    return "Organizar escopo e executar de forma objetiva.";
}

function enviar() {

    let estado = analisarEstado(tipo.value, contexto.value);
    let sugestao = gerarSugestao(tipo.value, objetivo.value, contexto.value);

    let assunto = tipo.value + " - " + subtipo.value;

    promptFinal = `
ASSUNTO:
${assunto}

OBJETIVO:
${objetivo.value}

RESULTADO ESPERADO:
${resultadoEsperado.value}

RESTRIÇÕES:
${naoQuero.value}

CONTEXTO:
${contexto.value}
${duvida.value}
${motivo.value}

ESTADO ATUAL:
${estado}

SOLICITAÇÃO:
Analise, organize e gere uma resposta objetiva e utilizável.
Se faltar informação, peça de forma direta.
`;

    let resultadoTexto = `
SUGESTÃO IA:
${sugestao}

------------------------------

BLOCO UNIVERSAL:
${promptFinal}
`;

    resultado.innerText = resultadoTexto;

    banco.push({
        tipo: tipo.value,
        subtipo: subtipo.value,
        contexto: contexto.value,
        objetivo: objetivo.value,
        resultadoEsperado: resultadoEsperado.value,
        estado: estado,
        sugestao: sugestao,
        prompt: promptFinal,
        data: new Date().toLocaleString()
    });

    localStorage.setItem("mpHub", JSON.stringify(banco));
}

function copiar() {
    navigator.clipboard.writeText(promptFinal);
    alert("Prompt copiado!");
}

function exportar() {
    let blob = new Blob([JSON.stringify(banco, null, 2)], {type:"application/json"});
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "mp_hub.json";
    link.click();
}
</script>

</body>
</html>
